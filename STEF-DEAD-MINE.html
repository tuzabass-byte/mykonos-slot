<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STEF DEAD MINE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050403;color:#f1e4c3;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background-size:cover;background-position:center}
:root{--colw:132px;--logoh:76px;--barh:84px;--mp:54px;--gold:#f0bb3f;--gold2:#b57a1c;--ink:#120d07}
#app{position:relative;display:grid;height:100vh;height:100dvh;grid-template-columns:var(--colw) 1fr var(--colw);grid-template-rows:var(--logoh) 1fr auto;grid-template-areas:"top top top" "left stage right" "bar bar bar";background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.05) 0,rgba(0,0,0,.35) 60%,rgba(0,0,0,.75) 100%);opacity:0;transition:opacity .5s}
#app.on{opacity:1}
#top{grid-area:top;display:flex;align-items:center;justify-content:center;position:relative;padding-top:4px}
#demo{position:absolute;right:12px;top:10px;padding:3px 10px;border:1px solid var(--gold);border-radius:12px;color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.12em;background:rgba(0,0,0,.55)}
.col{display:flex;flex-direction:column;gap:10px;padding:8px 10px;justify-content:center;align-items:stretch}
#left{grid-area:left}#right{grid-area:right}
#stage{grid-area:stage;position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
#multPanel{align-self:center;margin-bottom:8px;display:flex;align-items:center;gap:12px;height:var(--mp);padding:0 22px;margin-top:2px;border:2px solid #6d4c15;border-radius:10px;background:linear-gradient(#2a2118,#0e0a06);box-shadow:inset 0 0 12px rgba(0,0,0,.8),0 0 14px rgba(240,187,63,.25)}
#multPanel .lbl{font-size:11px;letter-spacing:.2em;font-weight:700;color:#c7a45a}
#multVal{font-size:calc(var(--mp)*.72);font-weight:900;color:#ffe08a;text-shadow:0 0 8px #ffb000,0 0 22px #ff8a00;display:inline-block;animation:glow 1.6s ease-in-out infinite;font-variant-numeric:tabular-nums}
#multVal.bump{animation:bump .55s ease-out}
#multVal.bomb{color:#fff;text-shadow:0 0 10px #ff3b00,0 0 30px #ff5a00,0 0 50px #ff2a00}
@keyframes glow{0%,100%{text-shadow:0 0 6px #ffb000,0 0 16px #ff8a00;transform:scale(1)}50%{text-shadow:0 0 12px #ffd060,0 0 30px #ff9a00;transform:scale(1.06)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.7)}100%{transform:scale(1)}}
#fsBanner{align-self:center;margin-top:4px;display:none;gap:14px;padding:4px 16px;border-radius:8px;border:1px solid var(--gold);background:rgba(20,12,4,.85);font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--gold);flex-wrap:wrap;justify-content:center;text-align:center}
#fsBanner b{color:#fff}
#fieldWrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%}
#winPop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#ffe08a;text-shadow:0 0 12px #ff9a00,0 2px 0 #000;pointer-events:none;opacity:0;white-space:nowrap}
#winPop.show{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:900;font-size:clamp(26px,6vw,64px);letter-spacing:.06em;color:#ffe08a;text-shadow:0 0 14px #ff7a00,0 0 40px #ff4a00,0 3px 0 #2a1200;pointer-events:none;opacity:0;transition:opacity .3s;padding:0 5%}
#banner.show{opacity:1}#banner small{display:block;font-size:.34em;letter-spacing:.2em;color:#fff;margin-top:6px}
.btn{font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;min-width:44px;padding:6px 8px;border:2px solid #7a5516;border-radius:10px;color:#f6e3b0;font-weight:800;font-size:12px;letter-spacing:.08em;text-align:center;cursor:pointer;background:linear-gradient(#3a3026,#17110b);box-shadow:inset 0 1px 0 rgba(255,230,160,.25),0 3px 8px rgba(0,0,0,.6);line-height:1.1}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(1.2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{border-color:#ffd060;box-shadow:0 0 12px rgba(255,190,60,.7),inset 0 0 8px rgba(255,190,60,.3)}
.btn svg{width:20px;height:20px;flex:none}
.btn.gold{background:linear-gradient(#f4c64f,#a8701a);color:#2a1700;border-color:#ffe08a}
#spin{width:100%;aspect-ratio:1;max-width:116px;align-self:center;border-radius:22%;min-height:64px;border:3px solid #ffe08a;background:radial-gradient(circle at 35% 30%,#ffcf5a,#c27a12 55%,#7a4506);box-shadow:0 0 18px rgba(255,170,40,.55),inset 0 2px 0 rgba(255,255,255,.5),0 6px 12px rgba(0,0,0,.7)}
#spin svg{width:56%;height:56%}
#spin.spinning svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#bar{grid-area:bar;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px);padding:8px 14px;min-height:var(--barh);background:linear-gradient(rgba(10,7,4,.55),rgba(5,3,2,.92));border-top:2px solid #5d4214;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;align-items:center;gap:3px}
.grp .l{font-size:11px;letter-spacing:.18em;color:#dcc07c;font-weight:700}
.grp .v{font-size:22px;font-weight:900;color:#ffe08a;font-variant-numeric:tabular-nums;min-width:90px;text-align:center}
.betrow{display:flex;align-items:center;gap:8px}
.betrow .btn{width:44px;padding:0;font-size:22px}
.betrow .v{min-width:84px}
#xbet{font-size:11px;padding:4px 10px;min-height:44px}
#note{font-size:10px;color:#b09c6c;text-align:center;flex-basis:100%;margin-top:-2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:3vmin}
.ov.show{display:flex}
.panel{position:relative;width:min(860px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(#241a10,#0e0905);border:2px solid #8a6220;border-radius:14px;padding:18px 22px;box-shadow:0 0 40px rgba(0,0,0,.9),0 0 20px rgba(240,187,63,.15);user-select:text;-webkit-user-select:text}
.panel h2{margin:0 0 10px;color:var(--gold);letter-spacing:.14em;font-size:20px}
.panel h3{margin:16px 0 6px;color:#ffd77a;letter-spacing:.1em;font-size:14px}
.panel p,.panel li{font-size:13px;line-height:1.5;color:#e7d6ae;margin:4px 0}
.panel ul{padding-left:18px;margin:4px 0}
.panel .x{position:absolute;right:10px;top:10px;min-width:44px}
.panel table{width:100%;border-collapse:collapse;font-size:12px}
.panel td,.panel th{padding:4px 6px;border-bottom:1px solid #3a2c18;text-align:right}
.panel td:first-child,.panel th:first-child{text-align:left}
.panel td img{height:34px;vertical-align:middle;margin-right:8px}
.menu-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.card{border:2px solid #7a5516;border-radius:12px;padding:12px;background:linear-gradient(#2e2216,#120c07);display:flex;flex-direction:column;gap:6px}
.card h4{margin:0;color:var(--gold);letter-spacing:.08em;font-size:15px}
.card .pr{font-size:20px;font-weight:900;color:#ffe08a}.card .pr small{display:block;font-size:12px;color:#c9b27a;font-weight:600}
.card p{flex:1}
.row2{display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#3a0d0a;border:2px solid #d9442f;color:#ffd9cf;padding:10px 18px;border-radius:10px;font-weight:700;z-index:90;display:none;max-width:90vw;text-align:center}
#bigWin{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.7);z-index:40;text-align:center;cursor:pointer}
#bigWin .t{font-size:clamp(34px,9vw,110px);font-weight:900;letter-spacing:.06em;color:#ffe08a;text-shadow:0 0 20px #ff8a00,0 0 60px #ff4a00,0 4px 0 #2a1200;animation:glow 1s infinite}
#bigWin .a{font-size:clamp(30px,7vw,84px);font-weight:900;color:#fff;text-shadow:0 0 20px #ff9a00;margin-top:8px;font-variant-numeric:tabular-nums}
#bigWin .s{font-size:14px;letter-spacing:.3em;color:#c9b27a;margin-top:10px}
#loading{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#2a1d0e,#050302 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:5vw}
#loading canvas{max-width:92vw}
#pbar{width:min(520px,80vw);height:16px;border:2px solid #8a6220;border-radius:9px;background:#0a0704;overflow:hidden;box-shadow:0 0 16px rgba(240,187,63,.25)}
#pfill{height:100%;width:0;background:linear-gradient(#ffe08a,#c2831b 60%,#7a4a08);transition:width .15s}
#pct{font-weight:800;color:var(--gold);letter-spacing:.2em;font-size:14px}
#pstep{font-size:12px;color:#9c8756;min-height:16px}
#tap{display:none;font-size:20px;padding:14px 38px;min-height:52px}
#err{position:fixed;inset:0;z-index:200;background:rgba(10,2,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:6vw;text-align:center}
#err h2{color:#ff8a70;margin:0}#err p{max-width:640px;color:#ffd9cf;font-size:14px;margin:0}#err code{display:block;background:#200a05;padding:8px 12px;border-radius:6px;color:#ffb59f;font-size:12px;word-break:break-word}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (orientation:portrait) and (max-width:700px){
 :root{--colw:60px;--logoh:54px;--barh:96px;--mp:44px}
 #app{grid-template-areas:none}#top{grid-area:1/1/2/4}#stage{grid-area:2/1/3/4}#left{grid-area:2/1/3/2;z-index:3}#right{grid-area:2/3/3/4;z-index:3}#bar{grid-area:3/1/4/4}
 #fieldWrap{margin:0}
 .col{padding:4px 3px;gap:7px}
 .btn{font-size:8px;letter-spacing:0;padding:3px 1px;flex-direction:column;gap:2px;min-height:48px;border-radius:8px}
 .btn svg{width:18px;height:18px}
 #spin{min-height:52px;border-radius:20%}
 #bar{gap:6px 14px;padding:6px 8px}
 .grp .v{font-size:17px;min-width:70px}.betrow .v{min-width:64px}.betrow .btn{font-size:20px}
 #demo{font-size:9px;right:6px;top:6px;padding:2px 6px}
 #multPanel{padding:0 14px}
 #note{font-size:9px}
}
@media (max-height:460px) and (orientation:landscape){
 :root{--colw:96px;--logoh:34px;--barh:56px;--mp:34px}
 .col{gap:5px;padding:3px 5px}
 .btn{min-height:44px;font-size:10px;padding:3px 4px}
 #spin{max-width:70px;min-height:60px}
 #bar{padding:3px 10px;gap:4px 18px;flex-wrap:nowrap}
 .grp .l{font-size:8px}.grp .v{font-size:16px;min-width:70px}.betrow .btn{min-height:44px}
 #note{display:none}#xbet{min-height:44px}
 #multPanel{position:absolute;left:4px;top:2px;z-index:2;margin:0;padding:0 8px;gap:6px;flex-direction:column;height:auto;align-items:center}#multVal{font-size:22px}
 #fieldWrap{margin-top:0}
 #demo{top:4px;font-size:9px;padding:1px 6px}
 #multPanel .lbl{font-size:9px}
 .panel{padding:10px 14px;max-height:96vh}
}
</style></head><body>
<div id="app">
 <header id="top"><canvas id="logo"></canvas><span id="demo">DEMO</span></header>
 <aside id="left" class="col">
  <button class="btn" id="bMenu">MENU</button>
  <button class="btn" id="bSound">SOUND ON</button>
  <button class="btn" id="bInfo">INFORMATION</button>
 </aside>
 <main id="stage">
  <div id="multPanel"><span class="lbl">MULTIPLIER</span><b id="multVal">x1</b></div>
  <div id="fsBanner"></div>

 </main>
 <aside id="right" class="col">

 </footer>
</div>
<div class="ov" id="ovPanel"><div class="panel" id="panel"></div></div>
<div class="ov" id="ovConfirm" style="z-index:70"><div class="panel" style="width:min(460px,94vw)" id="confirmBox"></div></div>
<div id="bigWin"><div class="t"></div><div class="a"></div><div class="s">TAP TO CONTINUE</div></div>
<div id="toast"></div>
<div id="loading"><canvas id="logoL"></canvas><div id="pbar"><div id="pfill"></div></div><div id="pct">0%</div><div id="pstep">Зареждане...</div><button class="btn gold" id="tap">TAP TO START</button></div>
<div id="err"><h2>Грешка</h2><p id="errMsg"></p><code id="errDet"></code><div class="row2"><button class="btn" id="errCont" style="display:none">CONTINUE</button><button class="btn gold" id="errReload">RELOAD</button></div></div>

 for(let li=0;li<LINES.length;li++){const L=LINES[li];const t=[];for(let k=0;k<N;k++){const i=L[k];t[k]=act[i]?sym[i]:-1;}

function rockfall(x0,x1,n,u){for(let i=0;i<n;i++)P({k:'rock',x:x0+Math.random()*(x1-x0),y:-10-Math.random()*60,vx:(Math.random()-.5)*40,vy:50+Math.random()*100,g:1000*u,life:1.2+Math.random()*.6,max:1.8,size:(4+Math.random()*9)*u,rot:Math.random()*6,vr:(Math.random()-.5)*10});Snd.rocks(.8);}

function stepParts(dt){
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}if(p.drag){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vy*=f;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.k==='smoke')p.vy-=18*dt;}
}

  if(p.k==='ball'||p.k==='fire'){const r=p.k==='ball'?p.size*(1.2-a*.9)+p.size*.1:p.size*(1.25-a*.55);const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,'rgba(255,'+(245*a+10|0)+','+(190*a|0)+','+Math.min(1,a*1.6)+')');g.addColorStop(.45,'rgba(255,'+(150*a+30|0)+',20,'+Math.min(1,a*1.1)+')');g.addColorStop(1,'rgba(120,20,0,0)');c.globalCompositeOperation='lighter';c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill();c.globalCompositeOperation='source-over';}

   if(Math.random()<.7)P({k:'spark',x:p.x,y:p.y-sz*.45,vx:(Math.random()-.5)*80,vy:-40-Math.random()*60,g:300,life:.3,max:.3,size:1.6});}
 }

 for(let i=tweens.length-1;i>=0;i--){const q=tweens[i];const p=Math.min(1,(now-q.t0)/q.dur);q.fn(q.ease(p));if(p>=1){tweens.splice(i,1);q.res();}}

   else{const slide=Math.max(0,(u-.3)/.5),jit=u<.3?Math.sin(u*120)*1.5:0;
    c.save();c.globalAlpha=Math.max(0,1-slide*1.1);c.drawImage(sp.plate,p.x-sp.w/2+jit+slide*V.hw*.6,p.y-sp.h/2+slide*V.hh*1.6,sp.w,sp.h);c.restore();
    if(u<.55){const sn=Math.max(0,(u-.3)/.25);c.save();c.globalAlpha=1-sn;[[-1,0],[0,1]].forEach(h=>{c.save();c.beginPath();if(h[0]<0)c.rect(p.x-sp.w/2-5,p.y-sp.h/2-5,sp.w/2+5,sp.h+10);else c.rect(p.x,p.y-sp.h/2-5,sp.w/2+5,sp.h+10);c.clip();c.translate(h[0]<0?-sn*V.hw*.5:sn*V.hw*.5,sn*sn*V.hh*1.5);c.drawImage(sp.chain,p.x-sp.w/2,p.y-sp.h/2,sp.w,sp.h);c.restore();});c.restore();}
    if(u>.55){const sw=(u-.55)/.45;c.save();dia(c,p.x,p.y,V.hw*.98,V.hh*.98);c.clip();c.globalCompositeOperation='lighter';const g=c.createLinearGradient(p.x-V.hw+sw*2.4*V.hw-V.hw*.6,p.y-V.hh,p.x-V.hw+sw*2.4*V.hw,p.y+V.hh);g.addColorStop(0,'rgba(255,230,150,0)');g.addColorStop(.5,'rgba(255,240,190,.85)');g.addColorStop(1,'rgba(255,230,150,0)');c.fillStyle=g;c.fillRect(p.x-V.hw,p.y-V.hh,V.hw*2,V.hh*2);c.restore();}
   }}
 }
 const sz=Math.min(V.hw*1.32,V.hh*1.32*1.0)*1.0;const dsz=Math.max(sz,Math.min(V.hw,V.hh)*1.3);
 for(const i of order){if(V.sym[i]<0||!V.act[i])continue;const p=cellXY(i);const wl=V.hl[i];
  if(wl>0){c.save();c.globalCompositeOperation='lighter';const pl=.55+.45*Math.sin(now*.02);c.fillStyle='rgba(255,190,60,'+(.35*pl)+')';dia(c,p.x,p.y,V.hw*.95,V.hh*.95);c.fill();c.strokeStyle='rgba(255,230,140,'+pl+')';c.lineWidth=2.5;c.stroke();c.restore();}
  {const s=V.sym[i],sp_=(s===9||s===12)?.5+.25*Math.sin(now*.005+i):.2;c.save();c.globalCompositeOperation='lighter';c.globalAlpha=V.al[i];const gg=c.createRadialGradient(p.x,p.y+V.oy[i],0,p.x,p.y+V.oy[i],dsz*.55);gg.addColorStop(0,(s===9||s===12)?'rgba(255,170,40,'+sp_+')':'rgba(255,210,150,'+sp_+')');gg.addColorStop(1,'rgba(255,150,50,0)');c.fillStyle=gg;c.beginPath();c.arc(p.x,p.y+V.oy[i],dsz*.55,0,7);c.fill();c.restore();}
  drawSym(c,V.sym[i],V.bv[i],p.x,p.y+V.oy[i]-V.hh*.02,dsz,V.al[i],V.sc[i],now,V.fl[i]);}
 // ambient
 c.save();c.globalCompositeOperation='lighter';for(const a of ambient){a.y-=a.v*dt;a.x+=Math.sin(now*.0004+a.ph)*.00015;if(a.y<-.02){a.y=1.02;a.x=Math.random();}
  const tw_=.5+.5*Math.sin(now*.003+a.ph);c.fillStyle=a.g?'rgba(255,205,90,'+(.15+tw_*.5)+')':'rgba(220,200,170,.16)';c.beginPath();c.arc(a.x*V.W,a.y*V.H,a.s*(V.hw/22)*(a.g?1.1:.9),0,7);c.fill();}c.restore();
 drawParts(c,now);

function dropCell(i,off,delay,dur,promises){V.oy[i]=off;promises.push((async()=>{await wait(delay);await tw(dur,p=>{V.oy[i]=off*(1-dropEase(p));});V.oy[i]=0;Snd.thump();})());}
async function clearBoard(){const S=spd(),ps=[];for(let i=0;i<49;i++){if(V.sym[i]>=0){ps.push(tw(220*S,p=>{V.oy[i]=p*V.hh*3;V.al[i]=1-p;}));}}

async function playInit(st){
 await clearBoard();const S=spd();
 for(let i=0;i<49;i++){V.act[i]=st.act[i];V.unl[i]=-1;}
 const ps=[];const chains=E.CHAINS;
 chains.forEach((ch,ci)=>{const l=ch.filter(i=>st.act[i]);l.forEach((i,k)=>{V.sym[i]=st.sym[i];V.bv[i]=st.bv[i];dropCell(i,-((k+1)*2*V.hh+V.hh*4),ci*38*S+(l.length-k)*24*S,(380+k*20)*S,ps);});});

async function playWM(step){
 const S=spd(),u=V.hw/30;Snd.fanfare();
 const b=showBanner('WILD MINING','Dynamite sticks incoming',1500);
 await b;
 for(const st of step.sticks){
  const p=cellXY(st.c);Snd.fuse();
  const stick=P({k:'dyn',x:p.x,y:-30,life:5,max:5});
  const y0=-30;await tw(420*S,q=>{stick.y=y0+(p.y-y0)*q*q;stick.rot=q*5;});

async function playWin(step,acc){
 const S=spd(),u=V.hw/30,b=bet();
 for(const i of step.cells)V.hl[i]=1;
 for(const i of step.bombs)V.fl[i]=1;
 Snd.hit(step.lines.length);
 setMult(step.mult,step.bombs.length>0);
 const amt=step.win*b;let cx=0,cy=0;for(const i of step.cells){const p=cellXY(i);cx+=p.x;cy+=p.y;}cx/=step.cells.length;cy/=step.cells.length;
 popWin(amt,{x:cx,y:cy});const from=acc.v;acc.v+=amt;const cl=countLast(from,acc.v,500);

 if(step.unlocked.length){Snd.unlock();for(const i of step.unlocked){V.act[i]=1;V.unl[i]=0;V.sym[i]=-1;tw(900*S,p=>{V.unl[i]=p>=1?-1:p;});}}

  if(st.t==='init'){await playInit(st);}
  else if(st.t==='wm'){await playWM(st);}
  else if(st.t==='win'){await playWin(st,acc);}

}

async function playFreeSpins(v,label,b){

 await showBanner('CANARY FREESPINS','<span>'+label+' - '+fs.n+' SPINS</span>',2000);
 Snd.chirp();
 V.act.set(fs.st.act);setMultQuiet(fs.st.mult);fsBanner(fs,label);
 while(fs.left>0){
  const r=E.fsSpin(fs,rng,true,E.CAP-fs.total);
  const acc={v:fs.total*b-r.win*b};
  setMultQuiet(fs.st.mult-0);
  $('multVal').textContent='x'+r.steps[0].mult;
  await playSteps(r.steps,acc);
  fsBanner(fs,label);$('lastV').textContent=fmt(fs.total*b);

  if(r.capped||fs.total>=E.CAP)break;
 }

}
async function doSpin(){
 if(busy)return;
 const c=cost();if(Wallet.getBalance()<c-1e-9){toast('Недостатъчно виртуални кредити за този залог.');stopAuto();return;}
 busy=true;stopReq=false;Wallet.applyDelta(-c);lastWin=0;refreshUI();$('lastV').textContent='0.00';
 setMultQuiet(1);const b=bet();
 let res;
 try{
  if(forceWM){forceWM=false;res=E.runSpin(E.CFG().base,rng,{act:E.startAct(false),mult:1,hadWin:false},{forceWM:true},true);}
  else res=E.baseSpin(rng,xbet,true);
  const acc={v:0};
  await playSteps(res.steps,acc);
  let total=res.win*b;
  if(total>0){Wallet.applyDelta(total);}
  lastWin=total;refreshUI();
  if(res.fs&&!res.capped){await showBanner('3 CANARIES','CANARY FREESPINS TRIGGERED',1500);const w=await playFreeSpins('classic','CLASSIC',b);Wallet.applyDelta(w);total+=w;lastWin=total;}
  const tx=total/b;if(tx>=15)await bigWin(tx,total);
  refreshUI();
  if(res.wm||res.fs)stopAuto(true);
 }catch(e){busy=false;inFS=false;refreshUI();throw e;}
 busy=false;refreshUI();
 if(auto.left>0&&!stopReq){auto.left--;refreshUI();await wait(350*spd());if(!busy)doSpin();}
}

async function buyBonus(v,label){
 const b=bet(),price=Math.round(E.PRICES[v]*b*100)/100;
 if(Wallet.getBalance()<price-1e-9){toast('Недостатъчно виртуални кредити за тази покупка.');return;}
 busy=true;Wallet.applyDelta(-price);lastWin=0;refreshUI();closePanels();
 try{
  await clearBoard();
  const w=await playFreeSpins(v,label,b);Wallet.applyDelta(w);lastWin=w;
  const tx=w/b;if(tx>=15)await bigWin(tx,w);
 }catch(e){busy=false;inFS=false;refreshUI();throw e;}
 busy=false;refreshUI();
}
// ---------- panels ----------
function closePanels(){$('ovPanel').classList.remove('show');}
function openPanel(html){$('panel').innerHTML='<button class="btn x" id="pClose">CLOSE</button>'+html;$('ovPanel').classList.add('show');$('pClose').onclick=closePanels;}
$('ovPanel').addEventListener('click',e=>{if(e.target===$('ovPanel'))closePanels();});
function confirmBox(msg,ok){const b=$('confirmBox');b.innerHTML='<h2>CONFIRM</h2><p>'+msg+'</p><div class="row2" style="margin-top:14px"><button class="btn gold" id="cOk">CONFIRM</button><button class="btn" id="cNo">CANCEL</button></div>';$('ovConfirm').classList.add('show');$('cNo').onclick=()=>$('ovConfirm').classList.remove('show');$('cOk').onclick=()=>{$('ovConfirm').classList.remove('show');ok();};}
function xbetBlock(){return '<div class="tog"><div><b>xBET</b><p>Total spin cost becomes 1.25x the bet. CANARY and DYNAMITE weights double, so features trigger about twice as often. Not active in free spins or bonus purchases. Can be turned off at any time.</p></div><button class="btn '+(xbet?'on':'')+'" id="xbetP" style="min-width:110px">'+(xbet?'xBET ON':'xBET OFF')+'</button></div>';}
function bonusMenu(){
 if(busy||inFS)return;const b=bet();
 const defs=[['classic','CLASSIC','CANARY FREESPINS Classic','10 spins. The cascade multiplier is persistent and never resets between spins. The active area persists.'],['deep','DEEP SHAFT','CANARY FREESPINS Deep Shaft','8 spins. The whole 7x7 field is unlocked from the start. xBOMB WILD appears more often.'],['vein','DYNAMITE VEIN','CANARY FREESPINS Dynamite Vein','6 spins. Every spin starts with WILD MINING. The multiplier starts at x3 and persists.']];
 let h='<h2>BONUS</h2><p>Virtual credits only. Bet for pricing: EUR '+fmt(b)+'. Purchases use the base bet without xBET.</p><div class="cards">';
 defs.forEach(d=>{const pr=E.PRICES[d[0]];h+='<div class="card"><h4>'+d[2]+'</h4><p>'+d[3]+'</p><div class="pr">'+pr+'x BET<small>EUR '+fmt(pr*b)+'</small></div><button class="btn gold buy" data-v="'+d[0]+'">BUY</button></div>';});
 h+='</div><div style="margin-top:14px">'+xbetBlock()+'</div>';
 openPanel(h);
 document.querySelectorAll('.buy').forEach(bt=>bt.onclick=()=>{const v=bt.dataset.v,d=defs.find(x=>x[0]===v),pr=Math.round(E.PRICES[v]*b*100)/100;
  confirmBox('Buy '+d[2]+' for EUR '+fmt(pr)+' ('+E.PRICES[v]+'x bet)? This deducts virtual credits only.',()=>buyBonus(v,d[1]));});
 $('xbetP').onclick=()=>{toggleX();bonusMenu();};
}
function toggleX(){if(inFS)return;xbet=!xbet;store.set('xbet',xbet);refreshUI();}
function infoPanel(){
 const b=bet(),T=E.TUNE;let rows='';
 const ord=[8,7,6,5,4,3,2,1,0],lab=['10','J','Q','K','A','Compass','Tools','Bear','Miner'];
 ord.forEach(s=>{const im=ASSETS[KEYS[s]];rows+='<tr><td><img src="'+im+'">'+lab[s]+'</td>'+E.PAY[s].map(p=>'<td>'+fmt(p*T.psBase*b)+'</td>').join('')+'</tr>';});
 const sp=(k,t)=>'<tr><td><img src="'+ASSETS[k]+'">'+t+'</td></tr>';
 const P=E.PRICES;
 openPanel('<h2>INFORMATION</h2><h3>PAYTABLE (EUR, bet '+fmt(b)+')</h3><table><tr><th>Symbol</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7 in a row</th></tr>'+rows+'</table>'+
 '<table style="margin-top:8px">'+sp('wild','WILD - substitutes all symbols except CANARY and DYNAMITE')+sp('bomb','xBOMB WILD - WILD with a multiplier x2, x3, x5, x10, x25, x50 or x100')+sp('canary','CANARY - 3 anywhere trigger CANARY FREESPINS')+sp('dynamite','DYNAMITE - 3 anywhere trigger WILD MINING')+'</table>'+
 '<h3>RULES</h3><ul><li>The play field is a lattice of diamond cells, up to 7x7. The two lattice axes are the two screen diagonals (up-right and down-right).</li><li>3 or more identical symbols in a row along either diagonal pay. A run counts once per maximal line; a cell can belong to a run in each direction. WILD substitutes for every symbol except CANARY and DYNAMITE.</li><li>CASCADES: winning cells explode, symbols above fall down the screen and new symbols fill from the top. This repeats until there is no win.</li><li>MULTIPLIER: starts at x1 and rises by 1 with every further winning cascade in the same spin. It resets on every paid spin and is persistent during free spins.</li><li>UNLOCKING: the game starts with the central 5x5 area. Locked cells next to any winning cell unlock, up to the full 7x7.</li><li>xBOMB WILD: a WILD showing a multiplier. When it takes part in a win, its value is added to the cascade multiplier for the rest of the spin.</li><li>WILD MINING: 3 DYNAMITE trigger it. Six dynamite sticks drop one by one and each blast turns a 3x3 zone into WILD, some of them xBOMB WILD. Then cascades pay out.</li><li>CANARY FREESPINS: 3 CANARY trigger the Classic variant (10 spins, persistent multiplier and active area). Pay values in WILD MINING and free spins are calibrated separately: line pays x'+fmt(T.wmps)+' in base WILD MINING, x'+fmt(T.ps.classic/T.psBase)+' Classic, x'+fmt(T.ps.deep/T.psBase)+' Deep Shaft, x'+fmt(T.ps.vein/T.psBase)+' Dynamite Vein relative to the table above.</li></ul>'+
 '<h3>BONUS BUY (price x bet, EUR for current bet)</h3><ul><li>CANARY FREESPINS Classic: 10 spins, never resets the multiplier - '+P.classic+'x (EUR '+fmt(P.classic*b)+')</li><li>CANARY FREESPINS Deep Shaft: 8 spins, whole 7x7 unlocked, more xBOMB - '+P.deep+'x (EUR '+fmt(P.deep*b)+')</li><li>CANARY FREESPINS Dynamite Vein: 6 spins, each begins with WILD MINING, multiplier starts at x3 - '+P.vein+'x (EUR '+fmt(P.vein*b)+')</li></ul>'+
 '<h3>xBET</h3><p>Total spin cost is 1.25x the bet (shown as the BET value). CANARY and DYNAMITE weights double. Can be turned off any time; disabled during free spins and bonus purchases.</p>'+
 '<h3>MAX WIN</h3><p>The maximum win in one spin or feature is capped at 5000x the bet.</p><h3>DEMO</h3><p>This is a demo with virtual credits only. No real payments, no withdrawals. Balance is stored in this browser.</p>');
}
function menuPanel(){
 openPanel('<h2>MENU</h2><div class="menu-list"><button class="btn" id="mFull">FULLSCREEN</button><button class="btn" id="mQuick">QUICK SPIN: '+(quick?'ON':'OFF')+'</button><button class="btn" id="mReset">RESET DEMO BALANCE</button></div><p style="margin-top:14px">DEMO - virtual credits only. No real payments or withdrawals.</p>');
 $('mFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){toast('Цял екран не се поддържа на това устройство.');}};
 $('mQuick').onclick=()=>{quick=!quick;store.set('quick',quick);menuPanel();};
 $('mReset').onclick=()=>{if(busy||inFS){toast('Не може да нулирате баланса по време на въртене.');return;}confirmBox('Reset the demo balance to EUR 1000.00?',()=>{Wallet.reset();refreshUI();closePanels();});};
}
function autoPanel(){
 if(auto.left>0){stopAuto();return;}
 if(busy)return;
 openPanel('<h2>AUTO SPIN</h2><p>Stops on feature triggers.</p><div class="row2" style="margin-top:10px">'+[10,20,50,100].map(n=>'<button class="btn gold au" data-n="'+n+'" style="min-width:90px">'+n+'</button>').join('')+'</div>');
 document.querySelectorAll('.au').forEach(b=>b.onclick=()=>{closePanels();auto.left=+b.dataset.n;auto.total=auto.left;stopReq=false;refreshUI();auto.left--;refreshUI();doSpin();});
}
// ---------- wiring ----------
function wire(){
 $('spin').onclick=()=>{Snd.click();if(auto.left>0){stopAuto();return;}doSpin();};
 $('bPlus').onclick=()=>{if(betIdx<BETS.length-1){betIdx++;store.set('bet',betIdx);Snd.click();refreshUI();}};
 $('bMinus').onclick=()=>{if(betIdx>0){betIdx--;store.set('bet',betIdx);Snd.click();refreshUI();}};
 $('xbet').onclick=()=>{Snd.click();toggleX();};
 $('bBonus').onclick=()=>{Snd.click();bonusMenu();};
 $('bInfo').onclick=()=>{Snd.click();infoPanel();};
 $('bMenu').onclick=()=>{Snd.click();menuPanel();};
 $('bAuto').onclick=()=>{Snd.click();autoPanel();};
 $('bTurbo').onclick=()=>{turbo=!turbo;Snd.click();refreshUI();};
 $('bSound').onclick=()=>{Snd.setOn(!Snd.isOn());refreshUI();};
 $('bHome').onclick=()=>{location.href='index.html';};
 document.addEventListener('keydown',e=>{if(e.code==='Space'&&!$('ovPanel').classList.contains('show')){e.preventDefault();if(!busy)doSpin();}});
 window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('fieldWrap'));
}
// ---------- loading ----------
async function boot(){
 drawLogo($('logoL'),Math.min(window.innerWidth*.9,640),84);
 const names=Object.keys(ASSETS),total=names.length+2;let done=0;
 const prog=(s)=>{done++;const p=Math.round(done/total*100);$('pfill').style.width=p+'%';$('pct').textContent=p+'%';$('pstep').textContent=s;};
 const failed=[];
 for(const k of names){curStep='Декодиране на изображение: '+k;
  if(k==='bg'){const ok=await new Promise(res=>{const im=new Image();im.onload=()=>(im.decode?im.decode():Promise.resolve()).then(()=>{document.body.style.backgroundImage='url('+ASSETS.bg+')';bgOK=true;res(true);}).catch(()=>res(false));im.onerror=()=>res(false);im.src=ASSETS.bg;});if(!ok){failed.push(k);document.body.style.background='radial-gradient(ellipse at 50% 40%,#2a1d0e,#050302 75%)';}}
  else{const ok=await loadImage(k);if(!ok)failed.push(k);}
  prog(curStep);}
 curStep='Изграждане на аудио';try{Snd.build();}catch(e){showErr('Аудиото не може да бъде изградено (стъпка: '+curStep+'). Играта продължава без звук.',String(e&&e.message||e),true);}prog(curStep);
 curStep='Подготовка на полето';initAmbient();wire();{const r0=E.baseSpin(rng,false,true);V.sym.set(r0.steps[0].sym);V.bv.set(r0.steps[0].bv);}$('app').classList.add('on');resize();refreshUI();requestAnimationFrame(render);
 await new Promise(r=>setTimeout(r,60));resize();prog(curStep);
 if(failed.length)showErr('Неуспешно декодиране на изображения: '+failed.join(', ')+'. Използва се векторна резервна графика.','Стъпка: '+curStep,true);
 $('pstep').textContent='Готово';$('tap').style.display='flex';
 $('tap').onclick=()=>{try{Snd.start();}catch(e){}$('loading').style.display='none';if(TEST){}};
 window.__sdm={doSpin,bonusMenu,V,Engine:E,explode,cellXY,ready:true};
}
curStep='Стартиране';boot();
})();

</script></body></html>
