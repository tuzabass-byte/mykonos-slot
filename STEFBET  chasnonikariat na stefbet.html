<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ЧАСОВНИКАРЯТ НА STEFBET</title>
<style>
:root{--gold:#f2c75c;--gold2:#b8862b;--gold3:#7a5314;--ink:#140c05;--txt:#f7e9c6;--dim:#b79d6a;--reelW:600px;--railW:100px;--railH:0px;--frameW:760px;--cyan:#6fe3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0705;color:var(--txt);font-family:Inter,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:brightness(.5) saturate(.9);transition:filter 1.2s}
#bgfx{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 30%,rgba(0,0,0,.78) 100%);transition:background 1.2s}
body.fs #bg{filter:brightness(.26) sepia(.85) saturate(1.4) hue-rotate(-10deg)}
body.fs #bgfx{background:radial-gradient(ellipse at 50% 45%,rgba(90,55,0,.18) 20%,rgba(0,0,0,.88) 100%)}
#app{position:relative;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#top{width:100%;max-width:1180px;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;gap:10px}
#logo{display:block;height:60px;width:auto;max-width:calc(100% - 170px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
#tools{display:flex;gap:8px}
.tbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 35% 30%,#4a3414,#1a1008);color:var(--gold);font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,230,160,.25);padding:0}
.tbtn:hover{border-color:var(--gold)}
.tbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtn.attn{animation:attn 1.1s infinite}
@keyframes attn{50%{box-shadow:0 0 0 6px rgba(242,199,92,.35),0 0 16px 4px rgba(242,199,92,.8)}}
#stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#frame{width:var(--frameW);padding:12px;border-radius:24px;background:linear-gradient(140deg,#fbe29a 0%,#c9992f 22%,#6f4b12 48%,#e2b552 70%,#8d611b 100%);box-shadow:0 18px 50px rgba(0,0,0,.8),0 0 0 2px #2b1a06,inset 0 2px 2px rgba(255,245,200,.7),inset 0 -3px 6px rgba(60,35,5,.8);position:relative;transition:background 1s}
#frame::before,#frame::after{content:"";position:absolute;top:5px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c0,#8a5d16);box-shadow:0 0 0 1px #3a2406}
#frame::before{left:7px}#frame::after{right:7px}
body.fs #frame{background:linear-gradient(140deg,#d9a940 0%,#7d5514 25%,#2e1d05 50%,#a97b22 75%,#5c3d0c 100%);box-shadow:0 18px 50px rgba(0,0,0,.9),0 0 40px rgba(220,150,20,.35),0 0 0 2px #1b1004}
#inner{display:flex;gap:6px;padding:6px;border-radius:16px;background:#0d0805;box-shadow:inset 0 0 14px #000,inset 0 0 0 1px #3d2808}
#rail{position:relative;width:var(--railW);flex:none;border-radius:10px;background:linear-gradient(180deg,#24170a,#120b05);box-shadow:inset 0 0 0 1px #4a3210,inset 0 0 12px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;gap:6px}
.rpanel{display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:100%;height:100%;gap:6px}
#fsPanel{display:none}
body.fs #gearPanel{display:none}body.fs #fsPanel{display:flex}
.rt{font-size:11px;letter-spacing:.1em;color:#f6d77f;font-weight:700;text-align:center;line-height:1.15;text-transform:uppercase}
#notches{display:flex;flex-direction:column;justify-content:space-around;align-items:center;flex:1;width:100%}
.notch{width:46px;height:46px;position:relative}
.notch svg{width:100%;height:100%;overflow:visible}
.notch .g{fill:#3d2b14;stroke:#9a7630;stroke-width:1.6}
.notch.on .g{fill:url(#gGold);stroke:#fff0b8}
.notch.on svg{filter:drop-shadow(0 0 5px rgba(255,200,70,.9))}
.notch.turn svg{animation:spin1 .9s cubic-bezier(.3,1.4,.5,1)}
.notch.fire svg{animation:spin1 .9s ease-in-out 2,flashn .45s ease-in-out 4}
@keyframes spin1{from{transform:rotate(-180deg) scale(.6)}to{transform:rotate(0) scale(1)}}
@keyframes flashn{50%{filter:drop-shadow(0 0 14px #fff) brightness(1.5)}}
#gearTxt{font-size:12px;font-weight:700;color:#e3c987;text-align:center;min-height:28px;line-height:1.2}
#rail.ready #gearTxt{color:#fff0b8;animation:attn2 .9s infinite}
@keyframes attn2{50%{opacity:.45}}
#clock{width:100%;max-width:100px;aspect-ratio:1;display:block}
.fsn{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.fsn b{font-size:22px;color:#fff0b8;font-variant-numeric:tabular-nums}
.fsn span{font-size:10px;letter-spacing:.1em;color:#f0cd72;font-weight:700}
#glass{position:relative;width:var(--reelW);height:calc(var(--reelW) * .8);border-radius:10px;overflow:hidden;background:#050302;box-shadow:inset 0 0 0 1px #5a3d10;flex:none}
#reels{display:grid;grid-template-columns:repeat(5,1fr);height:100%;background:radial-gradient(ellipse at center,#2a1c0c,#0a0603)}
.reel{position:relative;overflow:hidden;height:100%}
.reel+.reel::before{content:"";position:absolute;left:-2px;top:0;bottom:0;width:4px;z-index:6;background:linear-gradient(90deg,#1a0f03,#e2b552 45%,#8a5d16 60%,#1a0f03);box-shadow:0 0 6px rgba(0,0,0,.9)}
.belt{position:absolute;inset:0}
.slot{position:absolute;left:0;top:0;width:100%;height:25%;padding:3%;will-change:transform}
.slot i{display:block;width:100%;height:100%;border-radius:15%;background-size:cover;background-position:center;background-color:#06081a;box-shadow:inset 0 0 0 1.5px rgba(160,110,40,.7);transition:filter .35s}
.slot i.k-high{box-shadow:inset 0 0 0 2px #e6bb55}
.slot i.k-wild{box-shadow:inset 0 0 0 3px #fff0b8,0 0 10px rgba(255,220,120,.7)}
.slot i.k-scat{box-shadow:inset 0 0 0 3px #6fe3ff,0 0 10px rgba(80,220,255,.6)}
.reel.spin .belt{filter:blur(2.6px)}
.reel.spin::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,235,170,.0) 0 14px,rgba(255,235,170,.10) 14px 18px);opacity:.8}
.reel.antic::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 26px 8px rgba(90,225,255,.85);animation:attn2 .5s infinite}
.slot.win{z-index:3}
.slot.win i{animation:gp .8s ease-in-out infinite;box-shadow:inset 0 0 0 3px #ffe08a,0 0 18px 5px rgba(255,205,80,.95)}
@keyframes gp{50%{transform:scale(1.08);filter:brightness(1.35)}}
.dimming .slot:not(.win) i{filter:brightness(.36) saturate(.55)}
.slot.glowlock i{animation:lockglow .35s ease-in-out infinite alternate}
@keyframes lockglow{from{box-shadow:inset 0 0 0 3px #ffe08a,0 0 8px 2px #ffd36a}to{box-shadow:inset 0 0 0 4px #fff,0 0 28px 10px #ffd36a;filter:brightness(1.5)}}
.slot.flip{z-index:4}
.slot.flip i{animation:flipw .85s ease-in-out}
@keyframes flipw{0%{transform:rotateY(0) scale(1)}45%{transform:rotateY(90deg) scale(1.25);filter:brightness(2)}100%{transform:rotateY(0) scale(1)}}
.slot.fizzle i{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5%)}75%{transform:translateX(5%)}}
#vig{position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 14%,rgba(0,0,0,0) 86%,rgba(0,0,0,.5));box-shadow:inset 0 0 22px 4px rgba(0,0,0,.7)}
#gloss{position:absolute;inset:0;z-index:9;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 28%,rgba(255,255,255,0) 29%)}
#winBanner{position:absolute;left:50%;bottom:1.5%;z-index:12;transform:translate(-50%,20px) scale(.85);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;padding:4px 22px 5px;border-radius:40px;background:rgba(15,9,3,.8);border:2px solid var(--gold);box-shadow:0 0 22px rgba(242,199,92,.6);min-width:34%}
#winBanner.show{opacity:1;transform:translate(-50%,0) scale(1)}
#winBanner small{display:block;font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700}
#winBanner b{font-size:clamp(20px,4.4vw,34px);color:#fff0b8;font-variant-numeric:tabular-nums;line-height:1.1}
#toast{position:absolute;left:50%;top:44%;z-index:13;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-weight:900;font-size:clamp(22px,5.5vw,46px);letter-spacing:.04em;text-align:center;color:#fff0b8;text-shadow:0 0 22px #e0a020,0 3px 0 #5a3a08;white-space:nowrap}
#toast.show{animation:toast 1.7s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#bar{width:var(--frameW);border-radius:20px;background:linear-gradient(180deg,#2a1b0c,#120a04);border:2px solid var(--gold2);box-shadow:0 10px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,230,160,.3);padding:6px 14px 10px;transition:border-color 1s}
body.fs #bar{border-color:#7d5514}
#msg{min-height:24px;text-align:center;font-size:14px;font-weight:600;color:#f3e2b6;padding:2px 6px 6px;line-height:1.3}
#msg.warn{color:#ffb4a0}
#ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grp{display:flex;align-items:center;gap:10px}
.cell{display:flex;flex-direction:column;justify-content:center;min-width:92px;padding:4px 12px;border-radius:12px;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(184,134,43,.45);min-height:52px}
.cell label{font-size:11px;letter-spacing:.1em;color:#f0cd72;font-weight:700;text-transform:uppercase}
.cell b{font-size:19px;color:#fff3cd;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.betgrp{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:14px;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(184,134,43,.45)}
.betgrp .cell{background:none;box-shadow:none;min-width:70px;align-items:center;padding:2px 4px}
.rb{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 35% 30%,#5b4118,#1c1209);color:var(--gold);font-size:26px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.rb:disabled,.tbtn:disabled{opacity:.35;cursor:not-allowed}
.chip{min-width:56px;height:48px;border-radius:24px;border:2px solid var(--gold2);background:linear-gradient(180deg,#4a3414,#1c1209);color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.06em;padding:0 14px;position:relative}
.chip.on{background:linear-gradient(180deg,#f6d77f,#b8862b);color:#2a1904;border-color:#fff0b8}
#spin{width:96px;height:96px;border-radius:50%;border:0;padding:0;position:relative;flex:none;background:conic-gradient(from 200deg,#fff0b8,#b8862b,#6a4410,#e9bf5c,#fff0b8);box-shadow:0 6px 18px rgba(0,0,0,.8),0 0 0 3px #2b1a06;display:grid;place-items:center}
#spin::before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 36% 28%,#ffeaa8,#e0aa40 40%,#8a5a14 100%);box-shadow:inset 0 -4px 8px rgba(70,40,5,.7),inset 0 3px 4px rgba(255,255,230,.7)}
#spin span{position:relative;font-weight:900;font-size:16px;letter-spacing:.06em;color:#3a2305;text-shadow:0 1px 0 rgba(255,240,190,.8);text-align:center;line-height:1.1}
#spin:active::before{transform:scale(.95)}
#spin.busy::before{background:radial-gradient(circle at 36% 28%,#ffd6a0,#d27a2a 45%,#7a3a0a 100%)}
#spin:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
#spin.go{animation:pulseSpin 1.6s infinite}
@keyframes pulseSpin{50%{box-shadow:0 6px 18px rgba(0,0,0,.8),0 0 0 3px #2b1a06,0 0 24px 6px rgba(255,210,100,.55)}}
#autoWrap{position:relative}
#autoMenu{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:#160e06;border:2px solid var(--gold2);z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.8)}
#autoMenu.open{display:flex}
#autoMenu .chip{min-width:84px}
#modal,#card{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,3,1,.82);padding:14px}
#modal.open,#card.open{display:flex}
.sheet{width:min(720px,100%);max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px;background:linear-gradient(180deg,#27190a,#120a04);border:2px solid var(--gold2);padding:18px 18px 22px;box-shadow:0 20px 60px #000;user-select:text;-webkit-user-select:text}
.sheet h2{margin:0 0 4px;font-size:22px;color:var(--gold);letter-spacing:.04em}
.sheet h3{margin:18px 0 6px;font-size:14px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.sheet p,.sheet li{font-size:14px;line-height:1.5;color:#ead8ac;margin:4px 0}
.sheet ul{padding-left:18px;margin:4px 0}
.sheet .x{position:sticky;top:0;float:right;margin:-8px -6px 0 8px}
table.pt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.pt td,.pt th{padding:5px 6px;font-size:13px;text-align:right;border-bottom:1px solid rgba(184,134,43,.25)}
.pt th{font-size:10px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
.pt td:first-child,.pt th:first-child{text-align:left}
.pt .sy{display:flex;align-items:center;gap:10px}
.pt .sy i{display:block;width:44px;height:44px;border-radius:10px;background-size:cover;flex:none}
.cardbox{width:min(520px,100%);border-radius:24px;padding:26px 22px;text-align:center;background:radial-gradient(ellipse at 50% 0,#4b3010,#150c04 70%);border:3px solid var(--gold);box-shadow:0 0 60px rgba(242,199,92,.4),0 20px 60px #000;animation:cardin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardin{from{transform:scale(.7);opacity:0}}
.cardbox .k{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.cardbox h1{margin:8px 0;font-size:clamp(24px,6vw,36px);line-height:1.1;letter-spacing:-.01em;background:linear-gradient(180deg,#fff6cf,#f0c254 55%,#a8721c);-webkit-background-clip:text;background-clip:text;color:transparent}
.cardbox .big{font-size:clamp(54px,16vw,92px);font-weight:900;line-height:1;color:#fff0b8;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(240,170,40,.6)}
.cardbox p{margin:10px 0 16px;font-size:14px;color:#e8d3a0;line-height:1.45}
.cardbox .chip{min-width:160px;height:52px;font-size:15px}
#big{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,rgba(40,22,2,.78),rgba(0,0,0,.92));text-align:center}
#big.open{display:flex}
#big canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bigT{position:relative;font-size:clamp(30px,9vw,76px);font-weight:900;letter-spacing:-.01em;line-height:1.05;background:linear-gradient(180deg,#fff6cf,#f0c254 55%,#a8721c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a2406) drop-shadow(0 0 24px rgba(240,170,40,.7));padding:0 10px}
#bigT.pop{animation:popt .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popt{from{transform:scale(.6)}}
#bigN{position:relative;font-size:clamp(40px,13vw,110px);font-weight:900;color:#fff0b8;font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(240,170,40,.8);margin-top:8px}
#bigS{position:relative;margin-top:10px;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.k-hide{display:none}
body.narrow #top{min-height:56px}
body.narrow #logo{height:46px}
body.narrow #inner{flex-direction:column}
body.narrow #rail{width:100%;height:var(--railH);flex-direction:row;padding:4px 8px}
body.narrow .rpanel{flex-direction:row;justify-content:space-between;align-items:center}
body.narrow #notches{flex-direction:row;flex:1;justify-content:space-around}
body.narrow .notch{width:38px;height:38px}
body.narrow .rt{writing-mode:horizontal-tb;max-width:74px}
body.narrow #gearTxt{max-width:84px;font-size:10px;min-height:0}
body.narrow #clock{width:48px;max-width:48px}
body.narrow #frame{padding:8px;border-radius:18px}
body.narrow #bar{padding:4px 10px 10px}
body.narrow #ctrl{display:grid;grid-template-columns:1fr 100px 1fr;grid-template-areas:"bal spin last" "auto spin turbo" "bet bet bet";gap:8px 8px;align-items:center;justify-items:center}
body.narrow .grp{display:contents}
body.narrow #cBal{grid-area:bal;justify-self:stretch}
body.narrow #cLast{grid-area:last;justify-self:stretch}
body.narrow #spin{grid-area:spin}
body.narrow #autoWrap{grid-area:auto}
body.narrow #turbo{grid-area:turbo}
body.narrow .betgrp{grid-area:bet;justify-self:stretch;justify-content:space-between}
body.narrow .cell{min-width:0}
body.narrow .cell b{font-size:17px}
@media (prefers-reduced-motion:reduce){.notch.turn svg,.slot.win i{animation:none}}
</style>
</head>
<body>
<div id="bg"></div><div id="bgfx"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#f1c75b"/><stop offset="1" stop-color="#9a6a1c"/></linearGradient>
<linearGradient id="gBrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d0"/><stop offset=".35" stop-color="#f3cd62"/><stop offset=".6" stop-color="#b8862b"/><stop offset=".8" stop-color="#7a5314"/><stop offset="1" stop-color="#e0b04c"/></linearGradient>
</defs></svg>
<div id="app">
  <header id="top">
    <svg id="logo" viewBox="0 0 680 126" role="img" aria-label="ЧАСОВНИКАРЯТ НА STEFBET"></svg>
    <div id="tools">
      <button class="tbtn" id="bNew" title="Нова игра" aria-label="Нова игра"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="tbtn" id="bInfo" title="Информация и таблица на печалбите" aria-label="Информация">i</button>
      <button class="tbtn" id="bSnd" title="Звук" aria-label="Звук"><svg viewBox="0 0 24 24" id="sndIco"></svg></button>
    </div>
  </header>
  <main id="stage">
    <section id="frame"><div id="inner">
      <aside id="rail">
        <div class="rpanel" id="gearPanel">
          <div class="rt">Зъбна<br>предавка</div>
          <div id="notches"></div>
          <div id="gearTxt">0 / 5</div>
        </div>
        <div class="rpanel" id="fsPanel">
          <svg id="clock" viewBox="-60 -60 120 120"></svg>
          <div class="fsn"><b id="fsLeft">0</b><span>ОСТАВАТ</span></div>
          <div class="fsn"><b id="fsTotal">0</b><span>ОБЩО</span></div>
        </div>
      </aside>
      <div id="glass">
        <div id="reels"></div>
        <div id="vig"></div><div id="gloss"></div>
        <div id="winBanner"><small id="wbLabel">ПЕЧАЛБА</small><b id="wbVal">0</b></div>
        <div id="toast"></div>
      </div>
    </div></section>
    <section id="bar">
      <div id="msg" role="status" aria-live="polite">Натиснете ВЪРТИ, за да започнете</div>
      <div id="ctrl">
        <div class="grp">
          <div class="cell" id="cBal"><label>Баланс</label><b id="vBal">10 000</b></div>
          <div class="betgrp"><button class="rb" id="bMinus" aria-label="Намали ставката">−</button><div class="cell"><label>Ставка</label><b id="vBet">100</b></div><button class="rb" id="bPlus" aria-label="Увеличи ставката">+</button></div>
        </div>
        <button id="spin" aria-label="Завърти"><span id="spinTxt">ВЪРТИ</span></button>

  const SYMS = ['L1', 'L2', 'L3', 'L4', 'L5', 'H1', 'H2', 'H3', 'H4', 'H5', 'WILD', 'SCATTER'];
  const WILD = 10, SCAT = 11;
  const BASE_STRIPS = MODEL.strips.base, FS_STRIPS = MODEL.strips.free_spins;

  function windowOf(strip, stop) {
    const n = strip.length, w = [];

  }
  function makeGrid(strips, stops) {

    const per = []; let total = 0;

      const counts = [];
      for (let r = 0; r < 5; r++) { let c = 0; for (let row = 0; row < 4; row++) { const g = grid[r][row]; if (g === s || g === WILD) c++; } counts.push(c); }
      let run = 0;
      for (let r = 0; r < 5; r++) { if (counts[r] > 0) run++; else break; }
      if (run >= 3) {
        let ways = 1; for (let r = 0; r < run; r++) ways *= counts[r];
        const win = PAY[s][run - 3] * ways;
        per.push({ symbol: SYMS[s], length: run, ways: ways, pay_units: PAY[s][run - 3], win_units: win });
        total += win;
      }
    }
    let nS = 0;
    for (let r = 0; r < 5; r++) for (let row = 0; row < 4; row++) if (grid[r][row] === SCAT) nS++;

  }
  function multFromDraw(d) {
    if (!(Number.isInteger(d) && d >= 0 && d < 10000)) throw new Error('mult draw must be in [0,10000)');
    for (let i = 0; i < MULT_CUM.length; i++) if (d < MULT_CUM[i]) return i + 1;

  }

  // fsSpins: array of {stops, mult_draw}  OR  function(index) -> {stops, mult_draw}
  function playRound(bet, meter, stops, lockPositions, fsSpins) {
    if (!(bet > 0) || bet % 100) throw new Error('bet must be a positive multiple of 100');
    if (!(meter >= 0 && meter <= METER_MAX)) throw new Error('meter 0..5');
    const out = { bet: bet, meter_before: meter, stops: stops.slice() };
    const grid = makeGrid(BASE_STRIPS, stops);
    const isGear = meter === METER_MAX;
    out.gear_spin = isGear;
    out.rng_draws_consumed = 5;
    out.locks = [];

      const lp = lockPositions.slice();
      if (lp.length !== 2 || lp[0] === lp[1] || lp.some(p => !(p >= 0 && p < 20))) throw new Error('need 2 distinct lock positions 0..19');
      out.rng_draws_consumed += 2;
      for (const p of lp) {
        const r = Math.floor(p / 4), row = p % 4, was = grid[r][row];

      }

    const sp = scatterPayUnits(nScat);

    let total = Math.min(baseWin, CAP_UNITS);

        idx++;

      }

    out.fs_spin_summary = fsList.map(f => ({ multiplier: f.multiplier, scatter_count: f.scatter_count, credited_units: f.credited_units, retrigger_added: f.retrigger_added, spins_awarded_total: f.spins_awarded_total }));

  function drawRound(bet, meter, rand) {
    const draws = [];
    const R = n => { const v = rand(n); draws.push(v); return v; };
    const stops = []; for (let r = 0; r < 5; r++) stops.push(R(48));

    const out = [];

      const cells = [];
      for (let r = 0; r < w.length; r++) for (let row = 0; row < 4; row++) { const g = grid[r][row]; if (g === w.symbol || g === 'WILD') cells.push(r * 4 + row); }

        const bad = Object.keys(v.expected).filter(k => !subsetEqual(v.expected[k], got[k]));

}

  Snd.fsIntro();
  await showCard({ kicker: 'МАХАЛОТО СЕ ЗАДВИЖИ', title: 'БЕЗПЛАТНИ ВЪРТЕНИЯ', big: res.fs_awarded_initial, sub: 'Часовата стрелка определя множител от ×1 до ×5 за всяко безплатно завъртане. Три и повече махала добавят още 4 въртения.', btn: 'СТАРТ', auto: 6000 });
  document.body.classList.add('fs'); $('rail').classList.remove('ready');
  const strips = Engine.FS_STRIPS; let awarded = res.fs_awarded_initial, total = baseCredits;
  $('fsTotal').textContent = fmt(total); $('fsLeft').textContent = awarded; CL.ang = 0; paintHand();
  for (let m = 1; m <= 5; m++) $('cn' + m).setAttribute('fill', '#b99a54');
  Snd.tockStart(); await sleepRaw(500);
  const turbo = () => S.turbo;
  for (let i = 0; i < res.fs_spins.length; i++) {
    const s = res.fs_spins[i]; skip = false; G.phase = 'fs'; paintSpin();
    $('fsLeft').textContent = Math.max(0, awarded - i - 1);
    setMsg('Безплатно въртене ' + (i + 1) + ' от ' + awarded);
    const pre = stripCodes(strips, s.stops);
    Snd.spinStart(turbo());
    const hand = sweepHand(s.multiplier, turbo() ? 900 : 1700);
    G.phase = 'spinning'; paintSpin();
    await spinReels(s.stops, strips, pre, turbo(), anticFlags(pre));
    await hand; G.phase = 'fs'; paintSpin();
    $('fsLeft').textContent = Math.max(0, awarded - i - 1);
    if (s.credited_units > 0) {
      setMsg(winText(s.symbol_wins) || ('Махала ×' + s.scatter_count)); 
      const label = 'ПЕЧАЛБА ×' + s.multiplier;
      const gained = await presentWin(s.symbol_wins, s.grid, s.scatter_count, b, s.credited_units, s.multiplier, label);
      const from = total; total += gained;
      await countUp(v => $('fsTotal').textContent = fmt(v), from, total, 400); $('vLast').textContent = fmt(total);
    } else { setMsg('Без печалба · множител ×' + s.multiplier); await sleep(turbo() ? 150 : 400); }
    if (s.retrigger_added > 0) {
      awarded = s.spins_awarded_total; $('fsLeft').textContent = awarded - i - 1; toast('+' + s.retrigger_added + ' ВЪРТЕНИЯ!'); Snd.shimmer(4);
      Engine.scatterCells(s.grid).forEach(c => slotEl(c).classList.add('win')); $('reels').classList.add('dimming'); await sleep(1300); clearHL();
    }
  }
  Snd.tockStop(); G.phase = 'present'; paintSpin();
  const fsWin = total - baseCredits;
  await showCard({ kicker: res.capped ? 'МАКСИМАЛНА ПЕЧАЛБА 5000×' : 'КРАЙ НА БЕЗПЛАТНИТЕ ВЪРТЕНИЯ', title: 'ОБЩА ПЕЧАЛБА', big: '0', count: total, sub: 'Безплатни въртения: ' + res.fs_played + ' · печалба от тях: ' + fmt(fsWin), btn: 'ПРОДЪЛЖИ', auto: 7000 });
  document.body.classList.remove('fs');
  setMeter(S.meter, false); 
  if (total / b >= 20) await bigWin(total, b);
  return total - baseCredits;
}

/* ---------- controls ---------- */
async function startSpin() {
  if (G.phase !== 'idle' || !canSpin()) return;
  G.running = true;
  try { await playRoundUI(); } catch (e) { console.error(e); G.phase = 'idle'; document.body.classList.remove('fs'); Snd.tockStop(); Snd.spinStop(); S.balance += S.pending; S.pending = 0; save(); paintBal(); setMsg('Възникна грешка. Опитайте отново.', true); }
  G.running = false; paintSpin();
  if (S.auto > 0) {
    if (!canSpin()) { S.auto = 0; paintSpin(); return; }
    S.auto--; paintSpin(); await sleepRaw(S.turbo ? 250 : 550);
    if (S.auto >= 0 && G.phase === 'idle' && G.autoOn) { if (S.auto === 0) G.autoOn = false; startSpin(); }
  } else G.autoOn = false;
}
function onSpin() {
  if ($('modal').classList.contains('open')) return;
  Snd.init();
  if ($('card').classList.contains('open')) { if (cardResolve) cardResolve(); return; }
  if (G.phase === 'spinning') { doQuick(); return; }
  if (G.phase === 'present' || G.phase === 'fs') { skip = true; return; }
  if (G.phase === 'idle') {
    if (S.auto > 0 && G.autoOn) { S.auto = 0; G.autoOn = false; paintSpin(); return; }
    startSpin();
  }
}
$('spin').onclick = onSpin;
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); if (!e.repeat) onSpin(); }
  if (e.key === 'Escape') closeModal();
});
$('bMinus').onclick = () => { if (G.phase === 'idle' && S.betIdx > 0) { S.betIdx--; save(); paintBal(); paintSpin(); } };
$('bPlus').onclick = () => { if (G.phase === 'idle' && S.betIdx < BETS.length - 1) { S.betIdx++; save(); paintBal(); paintSpin(); } };
$('turbo').onclick = () => { S.turbo = !S.turbo; save(); paintSpin(); };
$('bAuto').onclick = () => { if (S.auto > 0) { S.auto = 0; G.autoOn = false; paintSpin(); return; } $('autoMenu').classList.toggle('open'); };
document.querySelectorAll('#autoMenu .chip').forEach(b => b.onclick = () => {
  $('autoMenu').classList.remove('open'); const n = +b.dataset.n; if (n === 0) { S.auto = 0; G.autoOn = false; paintSpin(); return; }
  S.auto = n; G.autoOn = true; paintSpin(); if (G.phase === 'idle') { S.auto--; paintSpin(); startSpin(); }
});
document.addEventListener('click', e => { if (!e.target.closest('#autoWrap')) $('autoMenu').classList.remove('open'); });
$('bSnd').onclick = () => { Snd.init(); Snd.setMuted(!S.muted); paintSnd(); };

/* ---------- modal: info / paytable / confirm ---------- */
function openModal(html) { $('sheet').innerHTML = '<button class="tbtn x" id="mClose" aria-label="Затвори">✕</button>' + html; $('modal').classList.add('open'); $('mClose').onclick = closeModal; }
function closeModal() { $('modal').classList.remove('open'); G.infoOpen = false; }
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
function infoHTML() {
  const b = bet(); let rows = '';
  for (let s = 9; s >= 0; s--) { const p = Engine.PAY[s]; rows += '<tr><td><div class="sy"><i class="s' + s + '"></i>' + NAMES_BG[s] + '</div></td>' + p.map(u => '<td>' + fmt(b * u / 100) + '</td>').join('') + '</tr>'; }
  const sp = Engine.SCAT_PAY, fa = Engine.FS_AWARD;
  return '<h2>ЧАСОВНИКАРЯТ НА STEFBET</h2><p>Игра само с виртуални кредити. Няма реални пари и реални печалби. Теоретично връщане (RTP): около 95,15%.</p>' +
    '<h3>Таблица на печалбите · ставка ' + fmt(b) + '</h3><p>Стойностите са за всеки начин (комбинация), в кредити при текущата ставка.</p>' +
    '<table class="pt"><tr><th>Символ</th><th>×3</th><th>×4</th><th>×5</th></tr>' + rows +
    '<tr><td><div class="sy"><i class="s11"></i>махало (разпръснат)</div></td><td>' + fmt(b * sp[3] / 100) + '</td><td>' + fmt(b * sp[4] / 100) + '</td><td>' + fmt(b * sp[5] / 100) + '</td></tr>' +
    '<tr><td><div class="sy"><i class="s10"></i>главно зъбно колело (уайлд)</div></td><td colspan="3">заменя всички символи освен махалото</td></tr></table>' +
    '<h3>Как се печели</h3><ul><li>5 барабана × 4 реда = 1024 начина за печалба.</li><li>Печалбата се образува от 3 или повече еднакви символа на съседни барабани, започвайки от най-левия барабан.</li><li>Плаща се за всеки отделен начин; за всеки символ се плаща само най-дългата комбинация.</li><li>Уайлдът (главно зъбно колело) се появява на барабани 2–5 и замества всички символи освен махалото.</li><li>Махалото плаща навсякъде по барабаните: 3 махала = ' + sp[3] / 100 + '× ставката, 4 = ' + sp[4] / 100 + '×, 5 = ' + sp[5] / 100 + '×.</li></ul>' +
    '<h3>Зъбна предавка</h3><ul><li>Всяко печелившо въртене (включително печалба само от махала) запалва по един зъбец от петте в лявата колона/лентата над барабаните.</li><li>Когато и петте светнат, следващото въртене е „зъбно въртене“: две случайни позиции се заключват и се превръщат в уайлд. Ако позиция съдържа махало, махалото остава.</li><li>След зъбното въртене предавката започва отначало. В безплатните въртения предавката не се променя.</li></ul>' +
    '<h3>Безплатни въртения и часовата стрелка</h3><ul><li>3 махала = ' + fa[3] + ' безплатни въртения, 4 = ' + fa[4] + ', 5 = ' + fa[5] + '. Безплатните въртения използват специални ленти.</li><li>Преди всяко безплатно въртене часовата стрелка се спира на множител ×1 до ×5 (по-големите са по-редки). Той умножава всички печалби от въртенето, включително махалата.</li><li>3 или повече махала по време на безплатните въртения добавят 4 нови въртения (най-много 40 общо за рунда).</li></ul>' +
    '<h3>Ограничения</h3><ul><li>Максималната печалба за един рунд (въртене + безплатни въртения) е 5000× ставката; рундът свършва веднага щом се достигне.</li><li>Ставки: ' + BETS.map(fmt).join(', ') + '. Начален баланс: 10 000 кредита.</li><li>Голяма / Мега / Епична печалба се обявяват при 20× / 50× / 100× ставката.</li><li>Интервалът (Space) завърта барабаните; втори натиск спира барабаните по-бързо.</li></ul>';
}
$('bInfo').onclick = () => { openModal(infoHTML()); G.infoOpen = true; };
$('bNew').onclick = () => {
  if (G.phase !== 'idle') return;
  openModal('<h2>Нова игра</h2><p>Балансът ще бъде върнат на 10 000 кредита, а предавката — на 0. Продължавате ли?</p><p style="margin-top:16px"><button class="chip on" id="ngYes">ДА, НОВА ИГРА</button> <button class="chip" id="ngNo">ОТКАЗ</button></p>');
  $('ngNo').onclick = closeModal;
  $('ngYes').onclick = () => { S.balance = START; S.meter = 0; S.pending = 0; S.auto = 0; G.autoOn = false; save(); setMeter(0, false); paintBal(); $('vLast').textContent = '0'; setMsg('Нова игра: баланс 10 000'); closeModal(); paintSpin(); };
};

/* ---------- boot ---------- */
G.rand = Engine.makeCryptoRand(a => crypto.getRandomValues(a), 1);
setGridInstant(stripCodes(Engine.BASE_STRIPS, [32, 14, 20, 44, 33]), Engine.BASE_STRIPS);
if (S.pending > 0) { S.balance += S.pending; setTimeout(() => setMsg('Печалбата от прекъснатия рунд (' + fmt(S.pending) + ') е добавена към баланса.'), 100); S.pending = 0; save(); }
paintSnd(); paintBal(); setMeter(S.meter, false); paintSpin(); layout(); setTimeout(layout, 60); document.fonts && document.fonts.ready && document.fonts.ready.then(layout);
window.__game = { S, G };
})();

</script>
