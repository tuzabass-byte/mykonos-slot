<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STEF RISIKO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#04070f;color:#fff;font-family:system-ui,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.stage{position:relative;container-type:inline-size;width:min(100%,calc((100vh - 70px)*var(--ar,1.3333)));aspect-ratio:var(--ar,1.3333);overflow:hidden;border-radius:10px;background:#0a1226}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.nobg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#ffd45a;font-size:3cqw}
.z{position:absolute;display:flex;align-items:center;justify-content:center}
/* жива скала върху нарисуваната */
#ladderZ{border-radius:2.2cqw;background:linear-gradient(#0c1a3c,#060e24);border:.35cqw solid #8a6a22;box-shadow:inset 0 0 3cqw #000d,0 0 2cqw #000a;padding:1.2cqw 1.6cqw}
#ladder{list-style:none;margin:0;padding:0;width:100%;height:100%;display:flex;flex-direction:column;gap:.9cqw}
#ladder li{position:relative;flex:1;display:flex;justify-content:center;align-items:center;border-radius:1.4cqw;background:linear-gradient(#1a3270,#0f1f4a);border:.25cqw solid #2d4a96;color:#bcd0ff;font:800 3.1cqw Georgia,serif;letter-spacing:.04em;transition:background .25s,box-shadow .25s,color .25s,border-color .25s,transform .25s}
#ladder li small{position:absolute;left:1.6cqw;font:700 1.4cqw system-ui,sans-serif;opacity:.7}
#ladder li.lit{color:#2a1b00;border-color:#fff3b0;background:linear-gradient(#ffe27a,hsl(40 90% calc(38% + var(--k)*5%)));box-shadow:0 0 calc(.8cqw + var(--k)*.5cqw) hsl(44 100% 60% / calc(.35 + var(--k)*.1)),inset 0 .2cqw 0 #fff8;text-shadow:0 1px 0 #fff6}
#ladder li.cur{animation:pu 1s ease-in-out infinite;border-color:#fff}
#ladder li.loss{flex:.42;font:700 1.5cqw system-ui,sans-serif;letter-spacing:.2em;border-color:#5a1a24;background:#1a0a10;color:#a85a66}
#ladder li.bu{color:#2a1b00;border-color:#fff;background:linear-gradient(#fff8c8,#ffe27a);box-shadow:0 0 3cqw #ffe27a,inset 0 0 1cqw #fff;transform:scale(1.04);animation:none}
#ladder li.bu::after{content:"▲";position:absolute;right:1.8cqw;font-size:2cqw;color:#7a4b00}
#ladder li.bd{color:#fff;border-color:#ff6b6b;background:linear-gradient(#e0314e,#8f1020);box-shadow:0 0 3cqw #ff4d62;transform:scale(1.03);animation:none}
#ladder li.bd::after{content:"▼";position:absolute;right:1.8cqw;font-size:2cqw;color:#fff}
#ladder li.land{animation:ld .6s ease-out}
@keyframes ld{0%{filter:brightness(3.2);transform:scale(1.12)}100%{filter:none;transform:scale(1.04)}}
@keyframes pu{50%{filter:brightness(1.5)}}
/* табелки върху нарисуваните стойности */
.val{border-radius:.9cqw;background:linear-gradient(#17356c,#102a58);color:#ffd45a;font:800 2.5cqw Georgia,serif;text-shadow:0 .2cqw .4cqw #000;border:.2cqw solid #b88a2a;white-space:nowrap}
#msgZ{border-radius:2cqw;background:#050c1cb8;color:#ffe9a8;font:600 1.9cqw system-ui,sans-serif;text-align:center;padding:0 1cqw;line-height:1.25;text-shadow:0 .2cqw .4cqw #000}
/* невидими бутони върху нарисуваните */
.hs{position:absolute;padding:0;margin:0;border:0;background:transparent;cursor:pointer;color:transparent}
.hs:disabled{cursor:not-allowed}
.hs:disabled::after{content:"";position:absolute;inset:0;background:#000a;border-radius:inherit}
.hs:active:not(:disabled){filter:brightness(1.4)}
#risk{border-radius:50%;animation:gl 1.8s ease-in-out infinite}
#risk:disabled{animation:none}
@keyframes gl{50%{box-shadow:0 0 4cqw #ff6a4aaa}}
.hs.rect{border-radius:1.4cqw}
#auto.on{box-shadow:0 0 0 .4cqw #ffe27a,0 0 3cqw #ffe27a;background:#ffe27a55}
.stage.fast::before{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 5cqw #ffd45a99;animation:fl .35s steps(1) infinite;z-index:2}
@keyframes fl{50%{opacity:.2}}
.tools{display:flex;gap:10px;margin-top:8px;align-items:center;font-size:11px;color:#8ea0cc}
.sm{min-width:44px;min-height:40px;border-radius:10px;border:1px solid #e6b84a;background:#0a1a3c;color:#fff;font-size:17px;cursor:pointer}
/* калибриране */
.cal .z,.cal .hs{outline:2px dashed #3cf;background-clip:padding-box}
.cal [data-name]::before{content:attr(data-name);position:absolute;left:0;top:-1.6cqw;font:700 1.3cqw monospace;color:#3cf;background:#000a;padding:0 .3cqw;z-index:9}
.cal .sel{outline-color:#f5a}
#out{position:fixed;left:0;right:0;bottom:0;height:120px;background:#000e;color:#9f9;font:12px monospace;padding:8px;z-index:20;display:none;width:100%}
#test{position:fixed;top:0;left:0;right:0;background:#000e;padding:10px;font:12px monospace;white-space:pre;z-index:30}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* Celebration appears only after reaching the top prize */
#victoryFx{position:absolute;inset:0;width:100%;height:100%;z-index:12;pointer-events:none;display:none}
#victoryBanner{position:absolute;left:9%;right:9%;top:35%;z-index:13;pointer-events:none;text-align:center;opacity:0;transform:scale(.65);color:#fff4bd;font:900 clamp(18px,4.7cqw,70px) Georgia,serif;text-shadow:0 0 10px #ffb300,0 0 28px #ff7500,0 3px 5px #000;transition:opacity .22s,transform .35s}
#victoryBanner.show{opacity:1;transform:scale(1);animation:victoryPulse .5s ease-in-out infinite alternate}
@keyframes victoryPulse{to{filter:brightness(1.5);transform:scale(1.045)}}
@media(prefers-reduced-motion:reduce){#victoryBanner.show{animation:none}}
</style>
</head>

<script>
/* ===== ПОЗИЦИИ ВЪРХУ СНИМКАТА (x, y, ширина, височина в % от снимката) ===== */
const ZONES = {
  ladder:[28.5,14.5,43,56],
  msg:[25,9.6,50,3.6],
  bal:[84,23,11,5],
  bet:[85,40,10,5],
  win:[86,56,8,5],
  risk:[40,70,22,22],
  minus:[26,76,9,7],
  plus:[66,76,8,7],
  take:[15,85,20,7],
  auto:[68,85,20,7]
};
const ZMAP = { ladder:'ladderZ', msg:'msgZ', bal:'balZ', bet:'betZ', win:'lastZ', risk:'risk', minus:'bm', plus:'bp', take:'col', auto:'auto' };
function place() { for (const k in ZONES) { const e = document.getElementById(ZMAP[k]), z = ZONES[k]; e.style.left = z[0] + '%'; e.style.top = z[1] + '%'; e.style.width = z[2] + '%'; e.style.height = z[3] + '%'; } }
const bg = document.getElementById('bg');
bg.onload = () => { document.getElementById('stage').style.setProperty('--ar', bg.naturalWidth / bg.naturalHeight); };
bg.onerror = () => { bg.style.display = 'none'; document.getElementById('nobg').style.display = 'flex'; };

/* ===== ДВИГАТЕЛ (чист, без DOM) ===== */
const WIN = 369;                        // шанс 367 от 1000 за качване
const MULT = [1, 2, 4, 8, 16, 32];      // скала: удвояване на всяка стъпка
function rnd1000() { const a = new Uint16Array(1); let v; do { crypto.getRandomValues(a); v = a[0]; } while (v >= 65000); return v % 1000; }
function press(st, r) {
  const n = { ...st };
  if (!st.active) { if (st.bal < st.bet) return { st, err: 'balance' }; n.bal -= st.bet; n.active = true; n.pos = 0; }
  const from = n.pos, win = r < WIN, np = win ? from + 1 : from - 1;
  if (np < 0) { n.active = false; n.pos = 0; return { st: n, win: false, from, to: -1, payout: 0, end: true }; }
  if (np === MULT.length - 1) { const p = st.bet * MULT[np]; n.bal += p; n.active = false; n.pos = 0; return { st: n, win: true, from, to: np, payout: p, end: true, top: true }; }
  n.pos = np; return { st: n, win, from, to: np, payout: 0, end: false };
}
function collect(st) {
  if (!st.active || st.pos < 1) return { st, err: 'rule' };
  const p = st.bet * MULT[st.pos];
  return { st: { ...st, bal: st.bal + p, active: false, pos: 0 }, payout: p };
}
function optimalRTP() {
  const p = WIN / 1000, q = 1 - p, N = MULT.length - 1, V = Array(N + 1).fill(0); V[N] = MULT[N];
  for (let it = 0; it < 20000; it++) for (let k = N - 1; k >= 0; k--) {
    const cont = p * V[k + 1] + q * (k > 0 ? V[k - 1] : 0);
    V[k] = k >= 1 ? Math.max(MULT[k], cont) : cont;
  }
  return V[0];
}
/* ===== ЗВУК ===== */
let AC, mute = localStorage.sr_mute === '1';
const ac = () => { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; };
function tone(f, d, g, t0 = 0, type = 'sine') { if (mute) return; const c = ac(), o = c.createOscillator(), gn = c.createGain(), t = c.currentTime + t0;
  o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t + d); }
// Нови оригинални аркадни звуци — само аудио, без промяна на играта.
function chord(notes, duration=.22, gain=.10, type='triangle', step=.065) {
  if (mute) return;
  notes.forEach((f,i) => tone(f, duration, gain, i*step, type));
}
const sPress = () => {
  tone(145,.12,.18,0,'sawtooth');
  tone(390,.09,.11,.025,'square');
  chord([520,650,780],.09,.075,'triangle',.045);
};
const sTick = up => tone(up ? 890 : 530,.045,.045,0,'square');
const sUp = k => {
  chord([392,494,587,784,988,1175].map(f=>f*Math.pow(1.035,k)),.25,.13,'triangle',.095);
  tone(1568,.46,.065,.44,'sine');
};
const sDown = () => {
  chord([520,415,330,247,165],.25,.12,'sawtooth',.105);
  tone(105,.62,.13,.36,'triangle');
};
const sCash = n => {
  chord([523,659,784,1047,1319,1568,2093].slice(0,Math.max(4,n+1)),.35,.13,'triangle',.105);
  tone(2093,.65,.085,.68,'sine');
};
/* ===== ИЗГЛЕД ===== */
const $ = id => document.getElementById(id), wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => '€ ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const BETS = [1, 2, 5, 10, 20, 50];
let S = { bal: (localStorage.sr_bal === undefined ? 950 : Number(localStorage.sr_bal)), bet: 10, pos: 0, active: false };
let V = { active: false, pos: 0 }, busy = false, lit = -1, last = 0, autoOn = false;
const save = () => localStorage.sr_bal = S.bal;
const cell = i => document.querySelector('#ladder li[data-i="' + i + '"]');
function drawLadder() {
  const order = [...MULT.keys()].reverse().concat(-1);
  $('ladder').innerHTML = order.map(i => i < 0
    ? '<li data-i="-1" class="loss"><span>ЗАГУБА</span></li>'
    : `<li data-i="${i}" style="--k:${i}"><small>×${MULT[i]}</small><span></span></li>`).join('');
}
function amounts() { $('ladder').querySelectorAll('li').forEach(li => { const i = +li.dataset.i; if (i >= 0) li.querySelector('span').textContent = fmt(S.bet * MULT[i]); }); }
function setLit(p, flash) {
  lit = p;
  $('ladder').querySelectorAll('li').forEach(li => {
    const i = +li.dataset.i; if (i < 0) return;
    li.classList.toggle('lit', i <= p); li.classList.toggle('cur', i === p && p >= 0);
    if (flash && i === p) { li.classList.remove('land'); void li.offsetWidth; li.classList.add('land'); }
  });
}
let blinkT = null, blinkUp = true;
const targets = () => { const p = V.active ? V.pos : 0; return { up: p + 1, down: p - 1 }; };
function clearBlink() { $('ladder').querySelectorAll('li').forEach(li => li.classList.remove('bu', 'bd')); }
function showBlink(up) { clearBlink(); const t = targets(), el = cell(up ? t.up : t.down); if (el) el.classList.add(up ? 'bu' : 'bd'); }
function stopIdle() { clearInterval(blinkT); blinkT = null; clearBlink(); }
function startIdle() { stopIdle(); blinkUp = true; showBlink(true); blinkT = setInterval(() => { blinkUp = !blinkUp; showBlink(blinkUp); }, 150); }
async function spinBlink(finalUp) {
  stopIdle();
  const N = finalUp ? 13 : 14; let delay = 60;
  for (let k = 1; k <= N; k++) { const up = k % 2 === 1; showBlink(up); sTick(up); await wait(delay); delay *= 1.12; }
  const t = targets(), el = cell(finalUp ? t.up : t.down); if (el) { el.classList.remove('land'); void el.offsetWidth; el.classList.add('land'); }
  await wait(650);
}
function render() {
  $('bal').textContent = fmt(S.bal); $('bet').textContent = fmt(S.bet); $('last').textContent = fmt(last);
  $('col').disabled = busy || !(S.active && S.pos >= 1);
  $('risk').disabled = busy || autoOn || (!S.active && S.bal < S.bet);
  $('bm').disabled = $('bp').disabled = busy || S.active;
  $('auto').classList.toggle('on', autoOn);
  $('auto').disabled = (!autoOn && (busy || (!S.active && S.bal < S.bet)));
  $('mute').textContent = mute ? '🔇' : '🔊'; amounts();
}
function msg(t) { $('msg').textContent = t; }
/* Fireworks only on the top prize: visual overlay, no changes to odds or balance. */
function celebrateTop(payout) {
  const stage = $('stage'), canvas = $('victoryFx'), banner = $('victoryBanner');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const rect = stage.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width*dpr); canvas.height = Math.round(rect.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = rect.width, H = rect.height, particles=[];
  const colors=['#ffdc53','#fff5b2','#ff783c','#ff375a','#61d9ff','#ad8cff','#80ff9e'];
  canvas.style.display='block';
  banner.textContent='🏆 ВЪРХЪТ! '+fmt(payout)+' 🏆';
  banner.classList.add('show');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setTimeout(()=>{banner.classList.remove('show');canvas.style.display='none'},2200); return;
  }
  const start=performance.now(); let nextBurst=0;
  function burst(x,y){
    const color=colors[Math.floor(Math.random()*colors.length)];
    for(let i=0;i<64;i++){
      const a=Math.random()*Math.PI*2, v=1.3+Math.random()*3.7;
      particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:.009+Math.random()*.012,r:1+Math.random()*2.7,color});
    }
  }
  function frame(now){
    const elapsed=now-start;
    ctx.clearRect(0,0,W,H);
    if(elapsed<1750 && elapsed>=nextBurst){
      burst(W*(.18+Math.random()*.64),H*(.13+Math.random()*.49)); nextBurst+=260;
    }
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.991;p.life-=p.decay;
      if(p.life<=0){particles.splice(i,1);continue}
      ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowBlur=9;ctx.shadowColor=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    if(elapsed<2600) requestAnimationFrame(frame);
    else {canvas.style.display='none';banner.classList.remove('show');}
  }
  requestAnimationFrame(frame);
}
async function go() {
  if (busy) return;
  const wasActive = S.active, r = press(S, rnd1000());
  if (r.err) { msg('Недостатъчен баланс.'); autoOn = false; render(); return; }
  busy = true; S = r.st; save(); sPress(); $('stage').classList.add('fast');
  V = { active: true, pos: r.from }; if (!wasActive) setLit(0);
  render();
  stopIdle();
  const target = cell(r.win ? r.from + 1 : r.from - 1);
  if (target) target.classList.add(r.win ? "bu" : "bd", "land");
  await wait(180);
  clearBlink();
  if (r.win) {
    if (r.top) {
      for (let i = r.from + 1; i <= r.to; i++) { setLit(i, true); sUp(i); await wait(180); }
      last = r.payout; msg('Връх на скалата! Печалба ' + fmt(r.payout)); sCash(6); celebrateTop(r.payout); await wait(1600); setLit(-1);
    } else { setLit(r.to, true); sUp(r.to); msg('Качи се на ×' + MULT[r.to] + '. Рискувай пак или вземи ' + fmt(S.bet * MULT[r.to]) + '.'); }
  } else if (r.end) {
    sDown(); for (let i = r.from; i >= 0; i--) { setLit(i - 1); await wait(150); }
    last = 0; msg('Светлината угасна. Загуби залога.');
  } else { sDown(); setLit(r.to); msg('Светлината падна на ×' + MULT[r.to] + '.'); }
  V = { active: S.active, pos: S.pos };
  if (r.end) autoOn = false;
  $('stage').classList.remove('fast'); busy = false; render(); startIdle();
  if (autoOn && S.active) setTimeout(() => { if (autoOn && !busy) go(); }, 500);
}
async function take() {
  if (busy) return; const r = collect(S); if (r.err) return;
  busy = true; autoOn = false; stopIdle(); S = r.st; save(); last = r.payout; msg('Взе ' + fmt(r.payout) + '.'); sCash(4);
  setLit(lit, true); await wait(700); setLit(-1); V = { active: false, pos: 0 }; busy = false; render(); startIdle();
}
function toggleAuto() {
  if (autoOn) { autoOn = false; render(); return; }
  if (busy) return;
  if (!S.active && S.bal < S.bet) { msg('Недостатъчен баланс.'); return; }
  autoOn = true; render(); go();
}
$('risk').onclick = go; $('col').onclick = take; $('auto').onclick = toggleAuto;
$('bm').onclick = () => { const i = BETS.indexOf(S.bet); if (i > 0) { S.bet = BETS[i - 1]; render(); } };
$('bp').onclick = () => { const i = BETS.indexOf(S.bet); if (i < BETS.length - 1) { S.bet = BETS[i + 1]; render(); } };
$('mute').onclick = () => { mute = !mute; localStorage.sr_mute = mute ? '1' : '0'; render(); };
$('reset').onclick = () => { if (busy) return; autoOn = false; S = { bal: 950, bet: 10, pos: 0, active: false }; V = { active: false, pos: 0 }; last = 0; save(); setLit(-1); msg('Нова игра: € 950.00.'); render(); startIdle(); };
addEventListener('keydown', e => {
  if (document.body.classList.contains('cal')) return;
  if (e.code === 'Space') { e.preventDefault(); go(); }
  if (e.key.toLowerCase() === 'c') take();
});
$('fine').textContent = 'Виртуални кредити, без реални пари. Шанс за качване ' + (WIN / 10).toFixed(1) + '%. Интервал = РИСК, C = ВЗЕМИ.';
place(); drawLadder(); setLit(-1); render(); startIdle();

/* ===== КАЛИБРИРАНЕ: ?calibrate=1 ===== */
if (location.search.includes('calibrate=1')) {
  document.body.classList.add('cal'); let sel = 'ladder';
  const mark = () => { for (const k in ZMAP) $(ZMAP[k]).classList.toggle('sel', k === sel); };
  for (const k in ZMAP) $(ZMAP[k]).addEventListener('click', e => { if (document.body.classList.contains('cal')) { e.preventDefault(); e.stopPropagation(); sel = k; mark(); } }, true);
  addEventListener('keydown', e => {
    const z = ZONES[sel], st = e.altKey ? 1 : .2; let used = true;
    if (e.key === 'ArrowLeft') e.shiftKey ? z[2] -= st : z[0] -= st;
    else if (e.key === 'ArrowRight') e.shiftKey ? z[2] += st : z[0] += st;
    else if (e.key === 'ArrowUp') e.shiftKey ? z[3] -= st : z[1] -= st;
    else if (e.key === 'ArrowDown') e.shiftKey ? z[3] += st : z[1] += st;
    else if (e.key.toLowerCase() === 'p') { const o = $('out'); o.style.display = 'block'; o.value = 'const ZONES = {\n' + Object.entries(ZONES).map(([k, v]) => '  ' + k + ':[' + v.map(n => +n.toFixed(1)).join(',') + ']').join(',\n') + '\n};'; o.select(); used = false; }
    else used = false;
    if (used) { e.preventDefault(); place(); }
  });
  mark(); msg('КАЛИБРИРАНЕ: кликни зона, стрелки = местене, Shift+стрелки = размер, P = числа.');
}
/* ===== САМОПРОВЕРКА: ?test=1 ===== */
if (location.search.includes('test=1')) {
  const out = [], T = (n, c) => out.push((c ? 'OK   ' : 'FAIL ') + n);
  const st0 = () => ({ bal: 100, bet: 1, pos: 0, active: false });
  let r = press(st0(), 0); T('успех: баланс 99, стъпка 1', r.win && r.st.bal === 99 && r.st.pos === 1 && r.st.active);
  r = collect(r.st); T('събиране на ×2 = +2, баланс 101', r.payout === 2 && r.st.bal === 101 && !r.st.active);
  r = press(st0(), 999); T('загуба на първия ход: баланс 99', !r.win && r.end && r.st.bal === 99 && !r.st.active);
  let s = st0(); for (let i = 0; i < 5; i++) { r = press(s, 0); s = r.st; }
  T('5 успеха: ×32 авто-събиране, баланс 131', r.top && r.payout === 32 && s.bal === 131 && !s.active);
  s = st0(); s = press(s, 0).st; s = press(s, 0).st; r = press(s, 999);
  T('загуба на стъпка 2: пада на стъпка 1', r.to === 1 && r.st.pos === 1 && r.st.active && !r.end);
  r = press(r.st, 999); T('загуба на стъпка 1: пада на основата', r.to === 0 && r.st.active && !r.end);
  r = press(r.st, 999); T('загуба от основата: край', r.end && !r.st.active && r.st.bal === 99);
  T('граница: ' + (WIN - 1) + ' е успех, ' + WIN + ' е загуба', press(st0(), WIN - 1).win === true && press(st0(), WIN).win === false);
  T('недостатъчен баланс', press({ bal: 0, bet: 1, pos: 0, active: false }, 0).err === 'balance');
  T('събиране на основата е забранено', collect({ bal: 10, bet: 1, pos: 0, active: true }).err === 'rule');
  T('скала при залог 10: 10..320', MULT.map(m => m * 10).join() === '10,20,40,80,160,320');
  const rtp = optimalRTP();
  T('най-добра стратегия: RTP ' + (rtp * 100).toFixed(2) + '% (най-много 95%)', rtp <= .95 + 1e-9);
  let w = 0, N = 300000; for (let i = 0; i < N; i++) { let x = press(st0(), rnd1000()); if (x.st.active) w += collect(x.st).payout; }
  T('симулация (събиране на ×2): RTP ' + (w / N * 100).toFixed(1) + '%', Math.abs(w / N - WIN * 2 / 1000) < .02);
  const d = document.createElement('div'); d.id = 'test'; d.textContent = out.join('\n'); document.body.appendChild(d);
}
