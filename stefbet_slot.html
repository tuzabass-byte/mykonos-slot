--ff:'StefInter',Inter,'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg0);color:var(--ink);font-family:var(--ff);font-weight:600;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;font-weight:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
#bgimg{position:fixed;inset:-4%;background:#06142B var(--bgurl) center/cover no-repeat;filter:blur(7px) brightness(.5) saturate(1.15);z-index:0}
#bgshade{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 38%,rgba(6,20,43,.15),rgba(2,11,29,.82) 78%),linear-gradient(180deg,rgba(2,11,29,.55),rgba(2,11,29,.25) 40%,rgba(2,11,29,.85))}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(8px,env(safe-area-inset-top)) clamp(10px,2.2vw,30px) 4px}
.logo{height:clamp(30px,6.2vh,54px);width:auto;display:block}
.demo{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(56,225,255,.45);background:rgba(0,107,255,.14);padding:5px 10px;border-radius:99px;white-space:nowrap}
.hbtns{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,211,78,.45);background:linear-gradient(180deg,rgba(14,40,84,.9),rgba(6,20,43,.95));display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover,.btn:hover{border-color:var(--gold);box-shadow:0 0 14px rgba(255,211,78,.3)}
.ib.off svg{stroke:var(--muted)}
#histBtn{display:none}
/* stage */
.stage{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,28px);min-height:0;padding:0 clamp(8px,2vw,28px)}
#mw{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.machine{display:flex;flex-direction:column;align-items:center;gap:6px}
.fsbar{height:32px;display:flex;align-items:center;justify-content:center;gap:12px;visibility:hidden;font-size:clamp(11px,1.6vh,14px);letter-spacing:.08em;text-transform:uppercase}
body.fs .fsbar{visibility:visible}
.fsbar .pill{border:1px solid rgba(56,225,255,.6);background:rgba(0,107,255,.25);border-radius:99px;padding:5px 14px;color:#fff}
.fsbar .pill b{color:var(--gold);font-weight:800}
.x2{font-weight:800;background:var(--gg);color:#3a2500;border-radius:99px;padding:5px 12px;letter-spacing:.04em}
.frame{padding:8px;border-radius:24px;background:var(--gg);box-shadow:0 0 0 2px #5a3b05,0 0 38px rgba(0,107,255,.45),0 18px 50px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 6px rgba(90,55,0,.7);position:relative}
body.fs .frame{box-shadow:0 0 0 2px #0a3a7a,0 0 56px rgba(56,225,255,.7),0 18px 50px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.7),inset 0 -3px 6px rgba(90,55,0,.7)}
.window{padding:6px;border-radius:17px;background:linear-gradient(180deg,#041029,#020918);box-shadow:inset 0 0 28px 6px #000,inset 0 0 0 2px rgba(0,0,0,.7);position:relative;overflow:hidden}
.window::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(165deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.03) 28%,transparent 40%),radial-gradient(ellipse at 50% 120%,rgba(0,107,255,.18),transparent 60%);box-shadow:inset 0 0 22px 2px rgba(0,0,0,.65)}
#reelsWrap{position:relative}
#reels{display:grid;grid-template-columns:repeat(5,var(--cell));gap:var(--gap)}
.reel{position:relative;height:calc(var(--cell)*3 + var(--gap)*2);overflow:hidden;border-radius:calc(var(--cell)*.14);transition:box-shadow .2s}
.reel.antic{box-shadow:0 0 0 3px var(--cyan),0 0 26px 4px rgba(56,225,255,.8);animation:antic .35s ease-in-out infinite alternate;z-index:2}
@keyframes antic{from{box-shadow:0 0 0 2px var(--cyan),0 0 12px 2px rgba(56,225,255,.5)}to{box-shadow:0 0 0 4px #fff,0 0 34px 8px rgba(56,225,255,.95)}}
.tile{background-size:cover;background-position:center;background-color:#120a2a;border-radius:calc(var(--cell)*.14)}
.cell{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);will-change:transform;box-shadow:inset 0 0 0 1px rgba(255,211,78,.4),inset 0 0 14px rgba(0,0,0,.5)}
.reel.fast .cell{filter:blur(2.2px) brightness(.9)}
.dim .cell:not(.win){filter:brightness(.5) saturate(.7)}
.cell.win{z-index:2;box-shadow:inset 0 0 0 3px var(--gold),0 0 20px 3px rgba(255,211,78,.85);animation:winp .7s ease-in-out infinite alternate}
@keyframes winp{from{transform:var(--t) scale(1)}to{transform:var(--t) scale(1.06)}}
#lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3;filter:drop-shadow(0 0 6px rgba(255,211,78,.9))}
#lines polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.msg{height:34px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(12px,2.1vh,17px);color:var(--muted);letter-spacing:.02em;max-width:96vw}
.msg.win{color:var(--gold);font-weight:800;font-size:clamp(15px,2.8vh,22px)}
.msg.warn{color:var(--cyan)}
/* history side */
.side{display:none;width:250px;flex:none;align-self:center;max-height:92%;background:linear-gradient(180deg,rgba(10,30,64,.8),rgba(4,14,32,.9));border:1px solid rgba(255,211,78,.35);border-radius:16px;padding:14px;backdrop-filter:blur(6px)}
.side h3,.modal h3{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
@media (min-width:1000px) and (min-height:540px) and (orientation:landscape){.side{display:block}}
.hist-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.hist-list li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.hist-list li i{font-style:normal;color:var(--muted)}
.hist-list li em{font-style:normal;color:var(--muted);font-size:11px}
.hist-list li b{color:var(--muted);font-weight:600}
.hist-list li.w b{color:var(--gold);font-weight:800}
.hist-list li.fsr em{color:var(--cyan)}
.hist-empty{color:var(--muted);font-size:13px}
/* panel */
.panel{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,22px);padding:10px clamp(10px,2.2vw,30px) max(10px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,20,43,.35),rgba(2,11,29,.96));border-top:1px solid rgba(255,211,78,.28)}
.stat,.betbox{display:flex;flex-direction:column;gap:2px;min-width:clamp(100px,12vw,150px);padding:6px 14px;border-radius:12px;background:rgba(2,11,29,.7);border:1px solid rgba(0,107,255,.5);box-shadow:inset 0 0 12px rgba(0,107,255,.2)}
.stat span,.betbox>span{font-size:11px;letter-spacing:.12em;color:#A9BEDD;text-transform:uppercase}
.stat b{font-size:clamp(18px,3.2vh,26px);color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.betbox>div{display:flex;align-items:center;justify-content:space-between;gap:8px}
.betbox b{font-size:clamp(18px,3.2vh,26px);color:#fff;font-weight:800;font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:center}
.betbox button{width:44px;height:44px;border-radius:10px;border:1px solid rgba(56,225,255,.6);background:rgba(0,107,255,.3);font-size:22px;line-height:1;padding:0}
.betbox button:disabled,.btn:disabled,.spin:disabled{opacity:.4}
.btn{min-height:44px;min-width:64px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,211,78,.5);background:linear-gradient(180deg,rgba(14,40,84,.95),rgba(6,20,43,.95));font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.btn.on{background:linear-gradient(180deg,#2d8bff,#006BFF);border-color:var(--cyan);box-shadow:0 0 16px rgba(0,107,255,.7);color:#fff}
.spin{width:clamp(70px,13vh,96px);height:clamp(70px,13vh,96px);border-radius:50%;border:0;padding:0;flex:none;position:relative;background:radial-gradient(circle at 36% 28%,#6db4ff,#006BFF 52%,#003aa8);box-shadow:0 0 0 4px #FFD34E,0 0 0 6px #7a5208,0 0 28px rgba(0,107,255,.8),inset 0 -6px 12px rgba(0,20,80,.6),inset 0 4px 8px rgba(255,255,255,.4);color:#fff;display:grid;place-items:center;transition:transform .1s}
.spin:active{transform:scale(.95)}
.spin span{font-size:clamp(11px,1.8vh,14px);letter-spacing:.1em;font-weight:800}
.spin.go::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(56,225,255,.5);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.15);opacity:0}}
#automenu{position:absolute;bottom:calc(100% + 8px);display:none;gap:8px;padding:10px;border-radius:14px;background:rgba(4,14,32,.97);border:1px solid var(--gold);z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#automenu.show{display:flex}
/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,11,29,.8);backdrop-filter:blur(5px);z-index:50;padding:16px}
.ov.show{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{max-width:min(92vw,560px);text-align:center;padding:clamp(18px,4vh,36px) clamp(18px,4vw,40px);border-radius:22px;background:linear-gradient(180deg,#0b2350,#050f26);border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(214,155,33,.25),0 0 60px rgba(0,107,255,.55);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 6px;font-size:clamp(22px,5.4vh,40px);font-weight:800;letter-spacing:.02em;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.card p{margin:6px 0;color:var(--ink);font-size:clamp(13px,2.4vh,17px)}
.card .big{font-size:clamp(36px,10vh,76px);font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}
.card .sub{color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;font-size:clamp(11px,2vh,14px)}
.card .btn{margin-top:12px;padding:0 28px;background:var(--gg);color:#3a2500;border:0;font-weight:800}
#bigwin{background:rgba(2,11,29,.62)}
#bigwin .card{border-color:var(--cyan);box-shadow:0 0 0 5px rgba(56,225,255,.25),0 0 90px rgba(56,225,255,.7)}
.toast{max-width:min(90vw,520px)}
.modal{width:min(94vw,860px);max-height:min(88vh,88dvh);overflow:auto;border-radius:20px;background:linear-gradient(180deg,#0a1f45,#050f26);border:2px solid var(--gold);padding:18px clamp(14px,3vw,28px) 22px;position:relative;box-shadow:0 0 60px rgba(0,107,255,.5);user-select:text;-webkit-user-select:text}
.modal.sm{width:min(94vw,420px)}
.modal .x{position:sticky;float:right;top:0;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,211,78,.5);background:rgba(2,11,29,.9);font-size:22px;line-height:1;padding:0;z-index:2}
.modal h2{margin:0 0 12px;font-size:clamp(20px,4vh,28px);font-weight:800;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.modal h3{margin-top:20px}
.pt{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pt .row{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(0,107,255,.35)}
.pt .tile{width:64px;height:64px;flex:none}
.pt .row div{font-size:14px;line-height:1.5;color:var(--muted)}
.pt .row div b{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.pt .row div strong{color:#fff;font-weight:800;font-size:14px}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.pl{font-size:12px;color:var(--muted);text-align:center}
.pl div{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:3px;padding:4px;border-radius:6px;background:#020918;border:1px solid rgba(0,107,255,.4)}
.pl i{aspect-ratio:1;border-radius:2px;background:#10224a}
.pl i.h{background:var(--gold)}
.rules{margin:0;padding-left:18px;font-size:14px;line-height:1.55;color:var(--ink)}
.rules li{margin:4px 0}
.note{margin-top:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--cyan);color:var(--cyan);font-size:14px}
/* portrait / narrow */
@media (orientation:portrait),(max-width:640px){
 .panel{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-areas:"bal bal win win" "bet bet bet bet" "auto turbo spin spin";gap:8px}
 .st-bal{grid-area:bal}.st-win{grid-area:win}.betbox{grid-area:bet;flex-direction:row;align-items:center;justify-content:space-between}
 .betbox>div{flex:1;justify-content:flex-end;gap:14px}
 #auto{grid-area:auto}#turbo{grid-area:turbo}
 .spin{grid-area:spin;width:100%;height:58px;border-radius:30px}
 .spin.go::before{display:none}
 .stat,.betbox{min-width:0}
 #histBtn{display:grid}
 .demo{font-size:10px;padding:5px 9px;letter-spacing:.08em}
 .stage{padding:0 6px}
}
@media (max-height:520px) and (orientation:landscape){
 header{padding-top:4px;padding-bottom:0}.logo{height:28px}.panel{padding-top:6px;padding-bottom:6px;gap:8px}
 .stat,.betbox{padding:3px 10px;min-width:92px}.stat span,.betbox>span{font-size:9px}
 .stat b,.betbox b{font-size:17px}.betbox button{height:44px;width:44px}
 .spin{width:62px;height:62px}.fsbar{height:24px}.msg{height:26px}.btn{min-width:56px;padding:0 10px}
 #histBtn{display:grid}.ib{width:44px;height:44px}
}
@media (max-height:520px) and (max-width:860px) and (orientation:landscape){.demo{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6C4"/><stop offset=".3" stop-color="#FFD34E"/><stop offset=".55" stop-color="#D69B21"/><stop offset=".78" stop-color="#FFD34E"/><stop offset="1" stop-color="#A9740F"/></linearGradient>
<linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D69B21" stop-opacity="0"/><stop offset=".5" stop-color="#FFD34E"/><stop offset="1" stop-color="#D69B21" stop-opacity="0"/></linearGradient>

<div id="bgimg"></div><div id="bgshade"></div>

/* ==== WALLET adapter (standalone demo: localStorage). Swap for a server-side implementation later. ==== */
const Store = (function(){ const mem = {}; return {
  get: function(k){ try { const v = localStorage.getItem(k); return v === null ? (mem[k] === undefined ? null : mem[k]) : v; } catch(e){ return mem[k] === undefined ? null : mem[k]; } },
  set: function(k, v){ mem[k] = String(v); try { localStorage.setItem(k, String(v)); } catch(e){} },
  del: function(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} } }; })();
const WALLET = {
  KEY: 'stefbet_balance_v1',
  getBalance: function(){ const v = parseInt(Store.get(this.KEY), 10); if (isNaN(v) || v < 0){ Store.set(this.KEY, CONFIG.startBalance); return CONFIG.startBalance; } return v; },
  bet: function(amount){ const b = this.getBalance(); if (!(amount > 0) || amount > b) return false; Store.set(this.KEY, b - amount); return true; },
  settle: function(win){ const b = this.getBalance() + Math.max(0, Math.round(win)); Store.set(this.KEY, b); return b; },
  reset: function(){ Store.set(this.KEY, CONFIG.startBalance); return CONFIG.startBalance; }
};

/* ==== SELF TEST (?test=1) ==== */
function runSelfTest(){
  const rows = []; let fails = 0;
  function same(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
  TEST_VECTORS.vectors.forEach(function(v){
    const r = evaluateSpin(v.stops, v.mode, v.line_bet); const e = v.expected; const bad = [];
    ['line_units_raw','multiplier','line_units','scatter_count','scatter_units','total_units','total_credits','free_spins_awarded'].forEach(function(k){ if (r[k] !== e[k]) bad.push(k + ': ' + r[k] + ' != ' + e[k]); });
    const lw = r.line_wins.map(function(w){ return {line: w.line, symbol: w.symbol, count: w.count, pay_units: w.pay_units}; });
    if (!same(lw, e.line_wins)) bad.push('line_wins');
    if (v.grid && !same(r.grid, v.grid)) bad.push('grid');
    if (bad.length) fails++;
    rows.push({name: '#' + v.id + ' ' + v.tag + ' (' + v.mode + ', x' + v.line_bet + ')', ok: !bad.length, info: bad.join('; ')});
  });
  TEST_VECTORS.cap_round_tests.forEach(function(c, i){
    const got = capRound(c.uncapped_units); const ok = got === c.capped_units;
    if (!ok) fails++;
    rows.push({name: 'cap ' + c.uncapped_units, ok: ok, info: ok ? '' : got + ' != ' + c.capped_units});
  });
  document.title = 'STEFBET self-test: ' + (fails ? 'FAIL' : 'PASS');
  document.body.style.cssText = 'overflow:auto;height:auto;user-select:text';
  document.documentElement.style.overflow = 'auto';
  document.body.innerHTML = '<div style="max-width:760px;margin:0 auto;padding:24px;font-family:var(--ff);color:#EAF2FF"><h1 style="color:#FFD34E">STEFBET self-test: ' +
    (fails ? '<span style="color:#ff6b6b">FAIL</span>' : '<span style="color:#38E1FF">PASS</span>') + ' (' + (rows.length - fails) + '/' + rows.length + ')</h1>' +
    rows.map(function(r){ return '<div style="padding:5px 0;border-bottom:1px solid #123"><b style="display:inline-block;width:54px;color:' + (r.ok ? '#38E1FF' : '#ff6b6b') + '">' + (r.ok ? 'PASS' : 'FAIL') + '</b>' + r.name + (r.info ? ' <span style="color:#ff6b6b">' + r.info + '</span>' : '') + '</div>'; }).join('') + '</div>';
  window.__selfTest = {fails: fails, total: rows.length};
}

/* ---- audio (WebAudio, decoded from embedded base64) ---- */
const SND = {ctx: null, master: null, buf: {}, loop: null, ready: false};
function b64ToBuf(b64){ const s = atob(b64.split(',')[1]); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }
function initAudio(){
  if (SND.ctx){ if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = state.sound ? 1 : 0; SND.master.connect(SND.ctx.destination);
    ['spin', 'stop'].forEach(function(k){
      const ab = b64ToBuf(ASSETS[k]);
      const p = SND.ctx.decodeAudioData(ab, function(b){ SND.buf[k] = b; }, function(){});
      if (p && p.catch) p.catch(function(){});
    });
  } catch(e){}
}
function playStop(i){
  if (!SND.ctx || !SND.buf.stop || !state.sound) return;
  try { const s = SND.ctx.createBufferSource(); s.buffer = SND.buf.stop; s.playbackRate.value = 1 + i * 0.035;
    const g = SND.ctx.createGain(); g.gain.value = .8; s.connect(g); g.connect(SND.master); s.start(); } catch(e){}
}
function startLoop(){
  if (!SND.ctx || !SND.buf.spin || SND.loop) return;
  try { const s = SND.ctx.createBufferSource(); s.buffer = SND.buf.spin; s.loop = true; const g = SND.ctx.createGain(); g.gain.value = .45;
    s.connect(g); g.connect(SND.master); s.start(); SND.loop = {s: s, g: g}; } catch(e){}
}
function stopLoop(){
  if (!SND.loop) return; const l = SND.loop; SND.loop = null;
  try { l.g.gain.setTargetAtTime(0, SND.ctx.currentTime, .04); l.s.stop(SND.ctx.currentTime + .25); } catch(e){}
}
function setSound(on){
  state.sound = on; Store.set('stefbet_sound', on ? 1 : 0);

/* ---- reels ---- */
const reelsEl = $('#reels'); const reels = [];
let pitch = 106;
for (let r = 0; r < 5; r++){
  const el = document.createElement('div'); el.className = 'reel'; const cells = [];
  for (let j = 0; j < 4; j++){ const c = document.createElement('div'); c.className = 'cell tile'; el.appendChild(c); cells.push(c); }
  reelsEl.appendChild(el);
  reels.push({r: r, el: el, cells: cells, pos: 0, idx: [-1,-1,-1,-1], mode: 'base', state: 'idle', target: 0, stopAt: 0, v: 0, antic: false, d: 0, dur: 0, sStart: 0});
}
function renderReel(rl){
  const strip = CONFIG.strips[rl.mode][rl.r], L = strip.length;
  const p = ((rl.pos % L) + L) % L, i0 = Math.floor(p), f = p - i0;
  for (let j = 0; j < 4; j++){
    const s = strip[(i0 + j) % L];
    if (rl.idx[j] !== s){ rl.idx[j] = s; rl.cells[j].setAttribute('data-s', s); }
    const t = 'translate3d(0,' + ((j - f) * pitch).toFixed(1) + 'px,0)';
    rl.cells[j].style.transform = t; rl.cells[j].style.setProperty('--t', t);
  }
}
function showStops(stops, mode){ reels.forEach(function(rl, r){ rl.mode = mode; rl.pos = stops[r]; rl.idx = [-1,-1,-1,-1]; renderReel(rl); }); }
function layout(){
  const mw = $('#mw'); const W = mw.clientWidth, H = mw.clientHeight;
  const gap = Math.max(3, Math.round(Math.min(W, H) * 0.011));
  const fs = $('#fsbar').offsetHeight, msg = $('#msg').offsetHeight;
  const extraW = 2 * (8 + 6) + 4, extraH = 2 * (8 + 6) + fs + msg + 12 + 6;
  const cell = Math.floor(Math.max(28, Math.min((W - extraW - 4 * gap) / 5, (H - extraH - 2 * gap) / 3)));
  document.documentElement.style.setProperty('--cell', cell + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
  pitch = cell + gap;
  const sv = $('#lines'); const w = 5 * cell + 4 * gap, h = 3 * cell + 2 * gap;
  sv.setAttribute('width', w); sv.setAttribute('height', h); sv.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  reels.forEach(renderReel);
  if (state.lastLines) drawLines(state.lastLines.list, state.lastLines.thick);
}
const ease = function(x){ const c1 = 0.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
let rafOn = false, lastT = 0, allStopped = null;
const SPEED = 20; // cells per second
function tick(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; let active = false;
  reels.forEach(function(rl, r){
    if (rl.state === 'spin'){
      active = true; rl.pos -= rl.v * dt; const L = CONFIG.strips[rl.mode][r].length; rl.pos = ((rl.pos % L) + L) % L;
      if (now >= rl.stopAt){
        const f = rl.pos - Math.floor(rl.pos);
        rl.d = (REDUCED ? 0 : 3) + f; rl.sStart = now; rl.dur = REDUCED ? 1 : (state.turbo ? 260 : 560);
        rl.state = 'stop'; rl.pos = rl.target + rl.d; rl.el.classList.remove('fast');
      }
      renderReel(rl);
    } else if (rl.state === 'stop'){
      active = true; const x = (now - rl.sStart) / rl.dur;
      if (x >= 1){ rl.pos = rl.target; rl.state = 'idle'; rl.el.classList.remove('antic'); onReelStop(r); }
      else rl.pos = rl.target + rl.d * (1 - ease(x));
      renderReel(rl);
    }
  });
  if (active) requestAnimationFrame(tick);
  else { rafOn = false; }
}
function onReelStop(r){
  playStop(r);
  const nx = reels[r + 1]; if (nx && nx.antic && nx.state === 'spin') nx.el.classList.add('antic');
  if (reels.every(function(x){ return x.state === 'idle'; })){
    stopLoop(); state.spinning = false;
    if (allStopped){ const f = allStopped; allStopped = null; f(); }
  }
}
function spinReels(stops, mode){
  return new Promise(function(res){
    const t0 = performance.now(); const fast = state.turbo || REDUCED;
    const minSpin = REDUCED ? 150 : (state.turbo ? 320 : 800), stag = REDUCED ? 60 : (state.turbo ? 90 : 300), antDelay = REDUCED ? 200 : (state.turbo ? 450 : 1100);
    const grid = windowGrid(stops, mode); let scPrior = 0; let prev = t0 + minSpin - stag;
    reels.forEach(function(rl, r){
      rl.mode = mode; const L = CONFIG.strips[mode][r].length; rl.pos = ((rl.pos % L) + L) % L; rl.idx = [-1,-1,-1,-1];
      rl.antic = r >= 2 && scPrior >= 2;
      rl.stopAt = prev + stag + (rl.antic ? antDelay : 0); prev = rl.stopAt;
      grid[r].forEach(function(s){ if (s === CONFIG.scatter) scPrior++; });
      rl.target = stops[r]; rl.state = 'spin'; rl.v = SPEED * (state.turbo ? 1.35 : 1); if (!REDUCED) rl.el.classList.add('fast');
    });
    state.spinning = true; allStopped = res; startLoop();
    if (!rafOn){ rafOn = true; lastT = t0; requestAnimationFrame(tick); }
  });
}
function quickStop(){
  const now = performance.now(); let k = 0;
  reels.forEach(function(rl){ if (rl.state === 'spin'){ rl.stopAt = Math.min(rl.stopAt, now + k * 70); rl.antic = false; rl.el.classList.remove('antic'); k++; } });
}

/* ---- helpers ---- */
const sleepers = new Set();
const T = function(ms){ return (state.turbo || REDUCED) ? ms * 0.45 : ms; };
function sleep(ms){ if (state.skip) return Promise.resolve(); return new Promise(function(res){ const f = function(){ clearTimeout(t); sleepers.delete(f); res(); }; const t = setTimeout(f, ms); sleepers.add(f); }); }
function skipNow(){ state.skip = true; Array.from(sleepers).forEach(function(f){ f(); }); }
function countUp(from, to, dur, cb){
  return new Promise(function(res){
    if (state.skip || dur <= 0 || REDUCED){ cb(to); res(); return; }
    const t0 = performance.now();
    (function f(now){ if (state.skip){ cb(to); return res(); } const x = Math.min(1, (now - t0) / dur); cb(Math.round(from + (to - from) * (1 - Math.pow(1 - x, 2)))); if (x < 1) requestAnimationFrame(f); else res(); })(t0);
  });
}
function setMsg(t, cls){ const m = $('#msg'); m.textContent = t || ''; m.className = 'msg' + (cls ? ' ' + cls : ''); }
function setBal(v){ $('#bal').textContent = fmt(v === undefined ? WALLET.getBalance() : v); }
function setWin(v){ $('#win').textContent = fmt(v); }
function waitOverlay(id, ms, btn){
  return new Promise(function(res){
    const ov = $(id); ov.classList.add('show'); let done = false; let t;
    const fin = function(){ if (done) return; done = true; clearTimeout(t); ov.classList.remove('show'); ov.removeEventListener('click', fin); res(); };
    ov.addEventListener('click', fin); t = setTimeout(fin, ms);
  });
}
function flash(title, text, ms){
  $('#mTitle').textContent = title; $('#mText').textContent = text; return waitOverlay('#ovMsg', ms);
}

/* ---- lines & highlights ---- */
const NS = 'http://www.w3.org/2000/svg';
function centerOf(c, row){ const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')); return [c * pitch + cell / 2, row * pitch + cell / 2]; }
function drawLines(list, thick){
  const sv = $('#lines'); sv.innerHTML = ''; state.lastLines = {list: list, thick: thick};
  list.forEach(function(w, i){
    const pts = w.rows.map(function(row, c){ return centerOf(c, row).join(','); }).join(' ');
    const col = i % 2 ? '#38E1FF' : '#FFD34E';
    [['rgba(0,0,0,.55)', thick + 4], [col, thick]].forEach(function(s){
      const pl = document.createElementNS(NS, 'polyline'); pl.setAttribute('points', pts); pl.setAttribute('stroke', s[0]); pl.setAttribute('stroke-width', s[1]); sv.appendChild(pl);
    });
  });
}
function clearHighlights(){
  $('#reelsWrap').classList.remove('dim'); $('#lines').innerHTML = ''; state.lastLines = null;
  reels.forEach(function(rl){ rl.cells.forEach(function(c){ c.classList.remove('win'); }); });
}
function markCells(set){
  reels.forEach(function(rl, c){ for (let j = 0; j < 4; j++) rl.cells[j].classList.remove('win'); });
  set.forEach(function(k){ const p = k.split(','); const c = +p[0], row = +p[1]; reels[c].cells[row].classList.add('win'); });
  $('#reelsWrap').classList.add('dim');
}
function lineCells(w){ const s = []; for (let c = 0; c < w.count; c++) s.push(c + ',' + w.rows[c]); return s; }

/* ---- history ---- */
function renderHistory(){
  const html = state.history.length ? state.history.map(function(h){
    return '<li class="' + (h.win > 0 ? 'w' : '') + (h.fs ? ' fsr' : '') + '"><i>#' + h.n + '</i><em>' + (h.fs ? 'Безпл. · ' : 'Ставка ' + fmt(h.bet) + ' · ') + (h.win > 0 ? 'печалба' : 'без печалба') + '</em><b>' + (h.win > 0 ? '+' + fmt(h.win) : '0') + '</b></li>'; }).join('')
    : '<li class="hist-empty">Все още няма завъртания.</li>';
  $$('.hist-list').forEach(function(u){ u.innerHTML = html; });
}
function pushHistory(win, bet, fs){
  state.spinNo++; state.history.unshift({n: state.spinNo, bet: bet, win: win, fs: fs}); state.history = state.history.slice(0, 10);
  Store.set('stefbet_hist', JSON.stringify({h: state.history, n: state.spinNo})); renderHistory();
}

/* ---- UI state ---- */
function updateUI(){
  const busy = state.busy;
  $('#bet').textContent = fmt(totalBet());
  $('#betDn').disabled = busy || state.betIdx === 0;
  $('#betUp').disabled = busy || state.betIdx === BETS.length - 1;
  $('#turbo').classList.toggle('on', state.turbo); $('#turbo').setAttribute('aria-pressed', state.turbo);
  const a = $('#auto'); a.classList.toggle('on', state.autoOn);
  a.textContent = state.autoOn ? 'Стоп ' + state.autoLeft : 'Авто';
  a.disabled = busy && !state.autoOn;

  $('#spin').classList.toggle('go', !busy);
  $('#fsRem').textContent = state.fsRemaining; $('#fsTot').textContent = state.fsTotal; $('#fsWin').textContent = fmt(state.fsWin);
  document.body.classList.toggle('fs', state.mode === 'fs');
}
function saveFs(){
  if (state.mode === 'fs' && state.fsRemaining > 0) Store.set('stefbet_fs', JSON.stringify({r: state.fsRemaining, t: state.fsTotal, w: state.fsWin, u: state.roundUnits, b: state.betIdx}));
  else Store.del('stefbet_fs');
}
function checkBroke(){
  if (WALLET.getBalance() < BETS[0] && state.fsRemaining === 0){ $('#ovBroke').classList.add('show'); return true; }
  return false;
}

/* ---- win presentation ---- */
async function resolveSpin(res, mode){
  const lb = lineBet(), tb = totalBet();
  const allowed = Math.min(res.total_units, CONFIG.capUnits - state.roundUnits); const capped = allowed < res.total_units;
  state.roundUnits += allowed; const win = allowed * lb;
  const before = WALLET.getBalance(); if (win > 0) WALLET.settle(win);
  const after = WALLET.getBalance();
  pushHistory(win, mode === 'fs' ? 0 : tb, mode === 'fs');
  if (mode === 'fs') state.fsWin += win;
  state.capHit = capped || state.roundUnits >= CONFIG.capUnits;
  if (win <= 0){ setWin(0); setBal(after); updateUI(); setMsg(res.scatter_count === 2 ? 'Почти! Две звезди на екрана.' : 'Без печалба. Опитайте отново.'); return; }
  // highlight
  const set = new Set(); res.line_wins.forEach(function(w){ lineCells(w).forEach(function(k){ set.add(k); }); });
  if (res.scatter_count >= 3) res.grid.forEach(function(col, c){ col.forEach(function(s, row){ if (s === CONFIG.scatter) set.add(c + ',' + row); }); });
  markCells(set); drawLines(res.line_wins, Math.max(4, Math.round(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) * 0.06)));
  const parts = res.line_wins.length ? res.line_wins.length + (res.line_wins.length === 1 ? ' печеливша линия' : ' печеливши линии') : '';
  const sc = res.scatter_count >= 3 ? res.scatter_count + ' Звезди' : '';
  const x2 = mode === 'fs' && res.line_units_raw > 0 ? ' (x2)' : '';
  setMsg('ПЕЧАЛБА ' + fmt(win) + ' · ' + [parts + x2, sc].filter(Boolean).join(' + ') + (capped ? ' · лимит 2000x' : ''), 'win');
  state.presenting = true; updateUI();
  const dur = T(Math.min(2400, 700 + Math.log10(win / tb + 1) * 1500));
  const big = win > 20 * tb;
  await countUp(0, win, big ? 0 : dur, function(v){ setWin(v); setBal(before + v); });
  setWin(win); setBal(after);
  if (big) await bigWin(win, tb);
  else await sleep(T(res.line_wins.length > 1 ? 650 : 450));
  if (!state.turbo && !state.autoOn && res.line_wins.length > 1 && !state.skip){
    const lim = Math.min(res.line_wins.length, 4);
    for (let i = 0; i < lim && !state.skip; i++){
      const w = res.line_wins[i]; markCells(new Set(lineCells(w))); drawLines([w], Math.max(5, Math.round(pitch * 0.07)));
      setMsg('Линия ' + w.line + ': ' + w.count + '× ' + SYMNAME[w.symbol] + ' = ' + fmt(w.pay_units * lb * (mode === 'fs' ? CONFIG.fs.mult : 1)), 'win');
      await sleep(700);
    }
  }
  state.presenting = false;
}
async function bigWin(win, tb){
  const x = win / tb; const mega = x >= 50;
  $('#bigTitle').textContent = mega ? 'МЕГА ПЕЧАЛБА' : 'ГОЛЯМА ПЕЧАЛБА'; $('#bigX').textContent = x.toFixed(1).replace('.', ',') + '× от общата ставка';
  $('#bigAmt').textContent = '0'; const ov = $('#ovBig'); ov.classList.add('show');
  let closed = false; const close = function(){ closed = true; };
  ov.addEventListener('click', close);
  const dur = REDUCED ? 0 : Math.min(3200, 1400 + x * 25);
  const keep = state.skip; state.skip = false;
  await new Promise(function(res){
    const t0 = performance.now();
    (function f(now){ const k = Math.min(1, (now - t0) / (dur || 1)); $('#bigAmt').textContent = fmt(win * (dur ? 1 - Math.pow(1 - k, 2) : 1)); if (k < 1 && !closed) requestAnimationFrame(f); else res(); })(t0);
  });
  $('#bigAmt').textContent = fmt(win);
  if (!closed) await new Promise(function(res){ const t = setTimeout(res, T(1600)); const i = setInterval(function(){ if (closed){ clearTimeout(t); res(); } }, 50); setTimeout(function(){ clearInterval(i); }, 3000); });
  ov.removeEventListener('click', close); ov.classList.remove('show'); state.skip = keep;
}

/* ---- game flow ---- */
async function oneSpin(mode){
  state.skip = false; clearHighlights(); setWin(0); updateUI();
  const stops = pickStops(mode);
  setMsg(mode === 'fs' ? 'Безплатно завъртане…' : '');
  await spinReels(stops, mode);
  return {stops: stops, res: evaluateSpin(stops, mode, lineBet(), state.fsTotal)};
}
async function basePlay(){
  const tb = totalBet();
  if (WALLET.getBalance() < tb){
    let i = state.betIdx; while (i > 0 && BETS[i] > WALLET.getBalance()) i--;
    if (BETS[i] > WALLET.getBalance() || i === state.betIdx && BETS[i] > WALLET.getBalance()){ checkBroke(); return false; }
    state.betIdx = i; Store.set('stefbet_bet', i); updateUI(); setMsg('Ставката е намалена до ' + fmt(BETS[i]) + ' (недостатъчен баланс).', 'warn');
  }
  if (!WALLET.bet(totalBet())) return false;
  setBal(); state.roundUnits = 0; state.fsWin = 0; state.mode = 'base';
  const o = await oneSpin('base');
  await resolveSpin(o.res, 'base');
  if (o.res.free_spins_awarded > 0){
    state.fsTotal = state.fsRemaining = o.res.free_spins_awarded; state.fsWin = 0; state.mode = 'fs';
    $('#fsTitle').textContent = o.res.free_spins_awarded + ' БЕЗПЛАТНИ ЗАВЪРТАНИЯ'; saveFs();
  }
  return true;
}
async function freeSpinsFlow(resume){
  state.mode = 'fs'; updateUI(); saveFs();
  $('#fsTitle').textContent = resume ? 'ПРОДЪЛЖАВАНЕ' : state.fsTotal + ' БЕЗПЛАТНИ ЗАВЪРТАНИЯ';
  $('#fsText').textContent = resume ? 'Остават ' + state.fsRemaining + ' безплатни завъртания.' : 'Печалбите по линии се умножават по 2. Звездите носят още 10 завъртания (общо максимум 30).';
  $('#fsSub').textContent = 'Печалбите по линии x2';
  $('#fsGo').textContent = 'Старт'; await waitOverlay('#ovFs', 4200);
  while (state.fsRemaining > 0){
    state.fsRemaining--; updateUI();
    const o = await oneSpin('fs');
    await resolveSpin(o.res, 'fs');
    const aw = o.res.free_spins_awarded;
    if (o.res.scatter_count >= 3){
      if (aw > 0 && state.fsRemaining >= 0){ state.fsRemaining += aw; state.fsTotal += aw; updateUI();
        await flash('+' + aw + ' БЕЗПЛАТНИ ЗАВЪРТАНИЯ', 'Повторно активиране! Общо: ' + state.fsTotal + ' от максимум ' + CONFIG.fs.maxTotal + '.', T(2200)); }
      else await flash('МАКСИМУМ ЗАВЪРТАНИЯ', 'Достигнат е лимитът от ' + CONFIG.fs.maxTotal + ' безплатни завъртания.', T(2000));
    }
    if (state.capHit){ state.fsRemaining = 0; await flash('МАКСИМАЛНА ПЕЧАЛБА', 'Достигнат е лимитът 2000× от общата ставка за рунда.', T(2200)); }
    saveFs(); updateUI();
    if (state.fsRemaining > 0) await sleep(T(450));
  }
  clearHighlights();
  $('#fsTitle').textContent = 'ОБЩА ПЕЧАЛБА';
  $('#fsText').textContent = 'Безплатните завъртания приключиха. Общо спечелени: ' + fmt(state.fsWin) + ' кредита.';
  $('#fsSub').textContent = 'от ' + state.fsTotal + ' безплатни завъртания'; $('#fsGo').textContent = 'Продължи';
  await waitOverlay('#ovFs', 5000);
  state.mode = 'base'; state.fsTotal = 0; state.fsRemaining = 0; saveFs(); setMsg('Безплатните завъртания приключиха: ' + fmt(state.fsWin) + ' кредита.'); updateUI();
}
async function playLoop(){
  while (true){
    if (state.resumePending){ state.resumePending = false; await freeSpinsFlow(true); }
    else {
      const ok = await basePlay(); if (!ok){ state.autoOn = false; break; }
      if (state.fsRemaining > 0) await freeSpinsFlow(false);
    }
    if (state.autoOn){ state.autoLeft--; if (state.autoLeft <= 0) state.autoOn = false; updateUI(); if (state.autoOn){ await sleep(T(350)); continue; } }
    if (state.queued){ state.queued = false; continue; }
    break;
  }
}
async function startPlay(){
  initAudio();
  if (state.busy){
    if (state.spinning) quickStop(); else if (state.presenting){ state.queued = true; skipNow(); }
    return;
  }
  if (document.querySelector('.ov.show')) return;
  if (checkBroke()) return;
  state.busy = true; state.queued = false; updateUI();
  try { await playLoop(); } catch(e){ console.error(e); setMsg('Грешка: ' + e.message, 'warn'); }
  state.busy = false; state.spinning = false; state.presenting = false; state.autoOn = state.autoOn && false; updateUI(); setBal(); checkBroke();
  if (state.fsRemaining === 0 && !$('#msg').textContent) setMsg('Натиснете ЗАВЪРТИ за нова игра.');
}

function buildInfo(){
  const lb = lineBet(), tb = totalBet();
  const order = [5, 4, 3, 2, 1, 0];
  let h = '<h2>Информация и изплащания</h2><p style="margin:0 0 4px;color:#8EA7CC;font-size:14px">Показани за текущата обща ставка: <b style="color:#FFD34E">' + fmt(tb) + '</b> кредита (' + fmt(lb) + ' на линия, 20 линии)</p>';
  h += '<h3>Символи и изплащания (в кредити)</h3><div class="pt">';
  order.forEach(function(s){
    const pt = CONFIG.paytable[s]; const ks = Object.keys(pt).map(Number).sort(function(a, b){ return b - a; });
    h += '<div class="row"><div class="tile" data-s="' + s + '"></div><div><strong>' + SYMNAME[s] + '</strong><br>' + ks.map(function(k){ return k + '× &nbsp;<b>' + fmt(pt[k] * lb) + '</b>'; }).join('<br>') + '</div></div>';
  });
  h += '<div class="row"><div class="tile" data-s="6"></div><div><strong>Диамант (Wild)</strong><br>Само на барабани 2, 3 и 4.<br>Замества всички символи освен Звездата. Няма собствено изплащане.</div></div>';
  const sp = CONFIG.scatterPay;
  h += '<div class="row"><div class="tile" data-s="7"></div><div><strong>Звезда (Scatter)</strong><br>Плаща навсякъде върху 15-те позиции:<br>' + [5, 4, 3].map(function(k){ return k + '× &nbsp;<b>' + fmt(sp[k] * lb) + '</b> (' + (sp[k] / CONFIG.totalLines) + '× ставка)'; }).join('<br>') + '</div></div></div>';
  h += '<h3>Линии за печалба (20)</h3><div class="pls">';
  CONFIG.paylines.forEach(function(rows, i){
    let cells = ''; for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) cells += '<i' + (rows[c] === r ? ' class="h"' : '') + '></i>';
    h += '<div class="pl"><div>' + cells + '</div>' + (i + 1) + '</div>';
  });
  h += '</div><h3>Правила</h3><ul class="rules">' +
    '<li>5 барабана, 3 реда, 20 фиксирани линии. Общата ставка е 20 × ставката на линия (допустими ставки: ' + BETS.join(', ') + ').</li>' +
    '<li>Печалбите по линии се броят отляво надясно, започвайки от първия барабан, за последователни еднакви символи (Диамантът замества). Плаща се най-високата комбинация за линия; печалбите от различни линии се събират. Черешата плаща от 2 символа.</li>' +
    '<li>Печалбата от Звезди се добавя към печалбите по линии.</li>' +
    '<li>3 или повече Звезди в основната игра дават ' + CONFIG.fs.start + ' безплатни завъртания, в които печалбите по линии се умножават по ' + CONFIG.fs.mult + ' (печалбата от Звезди не се умножава). Звезди върху 2 барабана по време на въртенето активират кратко напрежение.</li>' +
    '<li>3 или повече Звезди по време на безплатните завъртания добавят още ' + CONFIG.fs.retrigger + ' завъртания; общо най-много ' + CONFIG.fs.maxTotal + '. По време на безплатните завъртания не се теглят кредити.</li>' +
    '<li>Максималната печалба за един рунд (задействащо завъртане + всички безплатни завъртания) е ' + (CONFIG.capUnits / CONFIG.totalLines) + '× общата ставка, т.е. ' + fmt(CONFIG.capUnits * lb) + ' кредита при текущата ставка.</li>' +
    '<li>Теоретичен връщане към играча (RTP): около ' + CONFIG.rtp + '%. Резултатите се определят с криптографски генератор на случайни числа (crypto.getRandomValues).</li>' +
    '<li>Управление: ЗАВЪРТИ или клавиш Интервал; ТУРБО за бързи завъртания; АВТО за 10/25/50/100 автоматични завъртания.</li></ul>' +
    '<div class="note"><b>Само виртуални кредити, без реална парична стойност.</b> Това е демонстрационна игра: кредитите не могат да се купят, обменят или изтеглят. Няма реални пари.</div>';
  $('#infoBody').innerHTML = h;
}

/* ---- init ---- */
try { const b = parseInt(Store.get('stefbet_bet'), 10); state.betIdx = (b >= 0 && b < BETS.length) ? b : 0; } catch(e){}
state.turbo = Store.get('stefbet_turbo') === '1';
try { const h = JSON.parse(Store.get('stefbet_hist') || 'null'); if (h){ state.history = h.h.slice(0, 10); state.spinNo = h.n || 0; } } catch(e){}
setSound(Store.get('stefbet_sound') !== '0');
try { const f = JSON.parse(Store.get('stefbet_fs') || 'null');
  if (f && f.r > 0){ state.mode = 'fs'; state.fsRemaining = f.r; state.fsTotal = f.t; state.fsWin = f.w; state.roundUnits = f.u; state.betIdx = f.b; state.resumePending = true; } } catch(e){}
WALLET.getBalance(); setBal(); renderHistory(); updateUI();
showStops(pickStops(state.mode === 'fs' ? 'fs' : 'base'), state.mode === 'fs' ? 'fs' : 'base');
layout();
setMsg(state.resumePending ? 'Имате незавършени безплатни завъртания. Натиснете ЗАВЪРТИ, за да продължите.' : 'Натиснете ЗАВЪРТИ или Интервал, за да играете.');
window.addEventListener('resize', layout); window.addEventListener('orientationchange', function(){ setTimeout(layout, 200); });
if (window.ResizeObserver) new ResizeObserver(layout).observe($('#mw'));
document.addEventListener('pointerdown', initAudio, {once: true});
checkBroke();
window.__stef = {state: state, WALLET: WALLET, startPlay: startPlay, reels: reels};
}
if (/[?&]test=1\b/.test(location.search)) { document.addEventListener('DOMContentLoaded', runSelfTest); if (document.readyState !== 'loading') runSelfTest(); }
else { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startUI); else startUI(); }
</script>
